schema_version: causal-profile-v2
profile_version: 1
genre: mystery
terminal_roles: [{role: crime_solution}]
causal_roles:
  - {role: crime_solution}
  - {role: victim}
  - {role: perpetrator}
  - {role: motive}
  - {role: means}
  - {role: opportunity}
  - {role: method}
  - {role: time_window}
  - {role: concealment}
minimum_independent_proof_routes: 2
allowed_opportunity_types: [physical_evidence, document, testimony]
required_freytag_phases: [setup, rising_action, crisis, climax, resolution]
