- id: detention_lockdown_3a
  scene_id: 3A
  at_turn: 8
  effects:
  - fact_id: detention_lockdown_spreading
    equals: true
  realizations:
  - text: Armored teams seal one holding block after another. The uprising is losing routes while it waits.
- id: relay_power_3b
  scene_id: 3B
  at_turn: 9
  effects:
  - fact_id: relay_power_failing
    equals: true
  realizations:
  - text: Charles's countermeasures make the relay lights flicker. The open connection will not hold much longer.
- id: routes_collapse_3c
  scene_id: 3C
  at_turn: 10
  effects:
  - fact_id: escape_routes_collapsing
    equals: true
  realizations:
  - when:
    - {fact_id: evidence_gap_marked_site_list, equals: true}
    verbatim: true
    text: >-
      Rising water is closing routes through the facility. Rebecca gave Kristin the locations, but Kristin left without a copy of her marked site list.
  - text: Rising water is closing routes through the facility. The remaining routes are narrowing fast.
