characters:
  kristin:
    name: Kristin Schweitzer
    aliases:
    - Kristin
    - Kristin Schweitzer
    narrator_bio: A 47-year-old former assessment lead for the U.S. Army with a background in Army intelligence, infrastructure, and operations who is practical, persistent, and reluctant to trust conspiracy theories.
  michelle:
    name: Dr. Michelle McGehee
    aliases:
    - Michelle
    - Dr. McGehee
    - Michelle McGehee
    - Shelly
    narrator_bio: A 48-year-old molecular biology and biotechnology researcher and author who is thoughtful, determined, and private. She is Kristin's closest friend; Kristin alone calls her "Shelly", while everyone else addresses her as Dr. McGehee.
  brandon:
    name: Brandon Corfman
    aliases:
    - Brandon
    - Brandon Corfman
    unnamed_label: the man watching Kristin
    named_by: brandon_identified
    narrator_bio: A 54-year-old former software developer who now lives as an isolated conspiracy researcher estranged from his family. His warnings about a shadow emergency program were widely dismissed before the disappearances. He helps Kristin, though he is guarded about his own past.
    axes:
    - conscious:
      - awake
      unconscious:
      - knocked out
    unavailable: unconscious
  charles:
    name: Charles Jenkins
    narrator_bio: A 58-year-old former senior government official with a forceful, disciplined manner and experience directing complex operations. He is Rebecca Jenkins's husband.
  rebecca:
    name: Rebecca Jenkins
    aliases:
    - Rebecca
    narrator_bio: Charles's 56-year-old wife and the chief executive of a biotechnology and defense contractor. She is exacting and technically capable.
  shift_supervisor:
    name: Shift supervisor
    aliases:
    - shift supervisor
    - supervisor
    narrator_bio: A facility shift supervisor responsible for cooling and infrastructure operations and staff oversight.
  senior_official:
    name: Imprisoned senior official
    aliases:
    - senior official
    - imprisoned official
    - government prisoner
    narrator_bio: A senior government official whom Charles has publicly blamed for the catastrophe. He is exhausted and observant.
  patrol_officer:
    name: Officer Reyes
    aliases:
    - federal patrol officer
    - patrol officer
    - the officer
    - Reyes
    narrator_bio: A young, polite federal patrol officer who works from a printed list and does not like what the list asks of him.
  walt_pruitt:
    name: Walt Pruitt
    aliases:
    - Walt
    - Mr. Pruitt
    - the neighbor
    narrator_bio: A retired bus driver in his seventies whose wife is one of the missing. He is tired, careful with his words, and unsure what he saw.
