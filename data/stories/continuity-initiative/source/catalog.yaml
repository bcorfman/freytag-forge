unplaced_facts:
  false_identities_ready:
    purpose: Kristin and Brandon have credible technical-inspector identities and a cooling-water/ventilation cover story for entering the facility.
  facility_perimeter_reached:
    purpose: Kristin and Brandon have reached the facility perimeter and passed the initial identity checks.
    on_assert:
    - move: kristin
      parent: facility_perimeter
  national_detention_network_known:
    purpose: Kristin knows the Los Angeles site is part of a national detention network.
  architects_strategy_known:
    purpose: Kristin knows Charles and Rebecca intend to leverage the manufactured catastrophe for political reconstruction/control.
  brandon_prepared_before_event:
    purpose: Kristin knows Brandon prepared for the disappearance before it occurred.
  processing_numbers_used_in_confrontation:
    purpose: Kristin used the copied prisoner numbers in the supervisor confrontation.
  service_route_used_in_confrontation:
    purpose: Kristin used the known service approach in the supervisor confrontation.
  kristin_deliberately_left_behind:
    purpose: JANUS records show Kristin was deliberately left behind.
  identity_scrutiny_visible:
    purpose: Facility staff are visibly scrutinizing Kristin’s inspector identity.
  prisoner_records_corrupted:
    purpose: Michelle's resistance has corrupted prisoner records, triggering Charles's purge order.
  inspector_cover_under_review:
    purpose: The facility is checking Kristin and Brandon's inspection cover closely enough that a second mistake will expose them.
  archive_security_sweep:
    purpose: Archive security is auditing access and narrowing the time Kristin and Brandon can remain among the records.
  purge_transfers_underway:
    purpose: The purge has moved from an announced threat to visible prisoner transfers and killing preparations.
