entry: 'Michelle''s text came in a little after 4:00am, lost among the emergency alerts while Kristin finished a late-night shift. She missed it by minutes. When she read it, her stomach dropped. Every call back failed. Kristin ran for her truck and drove as hard as the streets allowed, past sirens, ambulances, police cars, and intersections blocked for no reason anyone would explain. Was she hurt? Taken? Gone? Not knowing was the worst of it. She found the back door forced and let herself into the kitchen.


  The kitchen was wrong at a glance. Michelle''s chair lay tipped over at her workstation across the room, and her tablet and work bag were nowhere in sight. A mug sat on the workstation beside a stack of manuscript pages. The calendar and the lake photograph hung by the refrigerator, where they always had. Kristin was too frantic to read any of it yet. She called Michelle''s name.


  '
