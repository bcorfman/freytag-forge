brief: '**Setting:** Michelle’s house


  **Characters:**


  * Kristin Schweitzer

  * Dr. Michelle McGehee


  **Plot:** Kristin arrives at Michelle''s house shortly after the mass disappearance and discovers that Michelle is missing. Evidence inside the house suggests that she could have been taken rather than simply vanishing with the others.


  **Hidden canon:** Michelle hid a memory card for Kristin, taped beneath the drawer in Michelle''s workstation. It stays hidden until Kristin finds it.


  **Established timeline:** Around midnight, once she knew she was being watched, Michelle carved Kristin''s initials into the drawer with her letter opener and taped the card beneath it. At 4:07am she texted Kristin ("Come to the house. Don''t call.") and began a recording. The recording ends when intruders enter. They take her tablet and work bag and miss the card. The break-in was staged from inside. The patrol that arrives later is a second pass for one item their inventory lists as "removable media, not recovered."'
outline:
- id: 1A.1
  anchor: scene-1a1--michelle-is-gone
  title: Michelle Is Gone
  details:
  - missing tablet and work bag
  - splintered back door frame and thrown deadbolt
  - lukewarm mug of tea
  - folded reading glasses on manuscript pages
  - wall calendar and lake photograph
  - KMS initials carved in drawer
  prose: 'Kristin reaches Michelle''s neighborhood after navigating traffic jams, emergency vehicles and frightened people on a wide scale. Kristin takes in the room at a glance on arrival but is too frantic to read it yet. A few turns in, once she steadies herself, she reads the back door properly. Michelle is missing, but the house does not read as a burglary. It reads as a person''s last hour:


    * Michelle''s tablet and work bag are missing and not in their normal spots.

    * The chair at Shelly''s workstation has been overturned.

    * A mug of tea sits on the workstation with the bag still in it, faintly warm. Michelle made it near the end.

    * Her reading glasses lie folded on a stack of manuscript pages marked in red pen. She never goes anywhere without them.

    * The wall calendar has Saturday circled in her handwriting: *K — lemon cake.* It is Kristin''s birthday.

    * On the refrigerator, held by a pear-shaped magnet, a photograph of the two of them at a lake.

    * The back door shows signs of forced entry, but the splinters around the frame point outward, away from the house. It was broken from inside. The deadbolt is still thrown. The house is otherwise undisturbed, not burglarized.


    The rest of the house is quiet and empty; Michelle is not in it.


    Kristin knows Michelle would not leave her kitchen like this.


    Kristin notices the drawer on Michelle''s workstation has Kristin''s initials ''KMS'' newly carved into it, making it worth looking at more closely. Kristin did not carve them. In college they hid notes beneath desk drawers, and Michelle has always known where Kristin would look.


    When Kristin opens the drawer, it slides out to reveal a stapler, spare batteries, pens, and binder clips. When she closes it again, it rides high in its frame, leaving a thin gap beneath its lower edge wide enough for Kristin''s fingers.'
- id: 1A.2
  anchor: scene-1a2--michelles-last-investigation
  title: Michelle’s Last Investigation
  details:
  - Michelle's memory card
  - Kristin's laptop in her truck
  - Continuity Initiative files
  - population stabilization centers
  - Michelle’s research notes
  prose: 'Michelle''s phone uses a passcode. Kristin knows it because Michelle is her best friend. Kristin''s own phone unlocks when it recognizes her face. It has no passcode. Kristin''s laptop needs no password.


    On Michelle''s phone, Kristin finds the 4:07am text and then her own unanswered calls. If Officer Reyes is in the kitchen, his watching makes her uneasy.


    Kristin searches beneath the drawer and finds Michelle''s memory card taped there. She takes the card out to her truck and opens it on her laptop.


    The card contains fragments of Michelle’s research into a federal emergency program called the **Continuity Initiative**. Michelle titled the folders after their old dorm, so only Kristin would read them as a message.


    The files show that private contractors constructed dozens of enormous “population stabilization centers” before the disappearances. Officially, the centers were designed as shelters for natural disasters and biological attacks.


    Michelle’s notes contain one alarming sentence:


    > They are not preparing to protect people. They are preparing to choose who remains.'
- id: 1A.3
  anchor: scene-1a3--the-interrupted-message
  title: The Interrupted Message
  details:
  - voice recording
  - government tracking
  - imminent activation event
  - someone entering house
  - Michelle whispers
  - national catastrophe
  - radio and looping emergency broadcast
  prose: 'On the card, Kristin finds a damaged voice recording Michelle attempted to send shortly before she disappeared. In it, Michelle says government officials have been tracking her and that a planned “activation event” is imminent.


    Before naming her source, Michelle hears someone enter the house. The recording ends after she whispers:


    > Kristin, do not trust the emergency broadcasts.


    This becomes the story’s **inciting incident**. Kristin realizes Michelle’s disappearance may be connected to the national catastrophe.


    Kristin can test the warning with her own skills. The truck radio carries the same emergency statement every few minutes. If she listens and times two passes, it is the same ninety seconds, word for word. It is a loop, not a live voice. This is optional and costs two turns.'
- id: 1A.4
  anchor: scene-1a4--the-first-threat
  title: The First Threat
  details:
  - federal emergency patrol led by Officer Reyes
  - Michelle’s office search
  - Michelle's memory card
  - Walt Pruitt at the fence
  - marked front gate
  - reflective tape
  prose: 'Walt Pruitt, a retired bus driver in his seventies, stands at the fence between the yards. His wife is one of the missing. He saw county vans near 3:40 with no markings Kristin can read, and two men with a clipboard checking the addresses on the street. They skipped the house next door. He is not sure what he saw, and he says so. He will not repeat it to the patrol.


    An emergency patrol arrives at Michelle''s home unusually quickly. Officer Reyes, young and polite, works from a printed list. He conducts a quick welfare check and a targeted look at Michelle''s work area, asking specifically about her research and findings. He studies the lake photograph on the refrigerator a beat too long. He does not open the drawer. If Kristin has not taken the card, or takes it out of his sight, he finds nothing. If she takes it while he is watching, he challenges her, and the patrol''s suspicion follows her out of the house.


    After the patrol leaves, Kristin notices that one officer has quietly marked the front gate with a strip of reflective tape.


    She understands that the authorities intend to return.'
