entry: 'Kristin and Brandon came through the cooling-service panel into the records archive just as the lights came up at the far end. An audit sweep had started. Voices and footsteps were working their way down the aisles toward them. They had a few minutes among the archive terminals. Brandon whispered, "Use the archive terminals. Pull your own file first. My name may be on whatever you find. If it is, let me delete it before we copy the files, or tell me to leave it. Your call."


  '
