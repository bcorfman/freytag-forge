brief: '**Setting:** The facility’s records archive, its stacks and terminals, during an audit sweep


  **Characters:**


  * Kristin Schweitzer

  * Brandon Corfman

  * The shift supervisor, leading the audit

  * Dr. Michelle McGehee, through the medical terminal


  **Plot:** Kristin and Brandon reach the archive as an audit sweep begins. One file tells Kristin that she was left behind as bait and that Brandon built the system that chose the missing. She confronts him in whispers while the audit passes. Then Michelle answers her.'
outline:
- id: 2B.1
  anchor: scene-2b1--the-selection-algorithm
  title: The Selection Algorithm
  details:
  - audit sweep
  - records archive
  - archive terminals
  - Kristin's own file
  prose: 'The audit sweep is the pressure. The shift supervisor and his staff are working down the aisles. If he logged Kristin and Brandon for a follow-up audit in 2A, the sweep starts closer and moves faster.


    Kristin does not have to search file after file. The first thing she pulls is her own record. It names the system that made it: an artificial-intelligence system called **JANUS**.


    JANUS analyzed government, financial, medical, employment, education, and communications data to classify every American according to:


    * Usefulness to national reconstruction

    * Likelihood of organized resistance

    * Political influence

    * Psychological vulnerability

    * Family and social connections

    * Potential value as leverage over others


    Michelle was taken because JANUS predicted that her research and public credibility could unite opposition after the disappearance.'
- id: 2B.2
  anchor: scene-2b2--kristin-was-bait
  title: Kristin Was Bait
  details:
  - Kristin's classification
  - RETAINED
  - predicted to lead investigators to Corfman
  - anticipated journey
  - accessible evidence
  - held transfers
  prose: 'Kristin''s record is short. It reads: **RETAINED — predicted to lead investigators to CORFMAN.**


    She was left behind on purpose. Charles expected her to look for Michelle, find Brandon and lead security to his hidden network. Security left parts of Michelle''s evidence where Kristin could find them.


    The terminals also list the transfer queue. If Kristin opens it, dozens of prisoner transfers are being held, each pushed back a week under a maintenance ticket, and every ticket is closed with the same code: sensor fault. It is the excuse the building uses for anything it does not want to look at, the same one that closed the supervisor''s forty alarms. Someone is using it on purpose. Kristin does not know who yet.


    Kristin realizes that every step she has taken may have been anticipated. Directly below her record is the JANUS build record. Its author is Brandon Corfman.'
- id: 2B.3
  anchor: scene-2b3--brandons-role
  title: Brandon’s Role
  details:
  - JANUS build record
  - whispered confrontation
  - the stacks
  - Brandon's request
  - his name
  - the badge readers' three checks
  prose: 'The audit is coming down the aisle. Kristin confronts Brandon crouched between the shelves, in whispers, while footsteps pass on the other side. A raised voice or a sudden move could give them away.


    Brandon admits that he helped write the AI software used to identify people at risk during national emergencies. When he learned that Charles meant to use it for mass detention and political control, he tried to destroy the project. He failed and fled. Michelle knew about his involvement and believed his access was the only way to expose the program.


    Kristin feels betrayed. She suspects he may still be manipulating her to erase evidence of his own guilt.


    If she reads the access section of the build record, it lists the three things the badge readers check. They are the three Brandon said he knew at the gate. That is how two badges were forged in one night, and it is the sharpest thing she has to say to him. Brandon watches her read and says nothing.


    Then Brandon asks for exactly that. Before they copy the files, he wants to delete his name from the build record. "Let me fix this one thing."


    * If Kristin refuses, Brandon complies, stung. The evidence stays intact, and trust between them is colder.

    * If Kristin lets him, trust warms, but his name is gone from the record. Only his own word can prove his role later.


    Either way, Kristin copies the JANUS files and keeps them with her. If the audit reaches them before she decides, Brandon''s name stays.'
- id: 2B.4
  anchor: scene-2b4--michelles-hidden-resistance
  title: Michelle’s Hidden Resistance
  details:
  - medical terminal
  - maintenance line
  - Shelly
  - one reply
  - Michelle alive
  - the shift supervisor
  - the ticket header
  prose: 'As they move to leave, the medical terminal in the archive prints a maintenance line. It is in Michelle''s private phrasing, and it ends with "Shelly," the name only Kristin uses for her. Michelle has been using her access to the medical terminal to alter prisoner classifications, delay transfers and send coded messages through maintenance reports.


    Kristin can type one reply. Michelle answers once. She is alive. She is working against the facility from inside. She will send a route when she can. She says nothing about an uprising or the broadcast system.


    Michelle is not waiting to be rescued. That changes how Kristin leaves the archive.


    Kristin has reason to doubt a message that finds her. She was left behind as bait. If she has seen the held transfers, she can check the maintenance line against them: it carries the same ticket header and the same closing code, sensor fault. Whoever held the transfers wrote it. This is also how Michelle''s later messages travel, hidden among the maintenance reports nobody reads.


    If the audit reaches them first, the shift supervisor sees them and does not raise the alarm. He lets them go. He is one of the workers Michelle has quietly recruited, though Kristin does not learn that here.'
