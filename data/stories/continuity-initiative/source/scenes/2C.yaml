entry: 'Guards closed the command corridor at both ends. Then a woman in an executive''s suit walked between them, unhurried, a tablet under her arm. She looked at Brandon first. "I wondered when you''d come back," said Rebecca Jenkins. "Charles means to kill everyone below us, my people too. Help me remove him, Brandon, and I will give you Michelle." Kristin still carried the copied JANUS files.


  '
