brief: '**Setting:** A command corridor on the facility’s command levels, above the detention sectors


  **Characters:**


  * Kristin Schweitzer

  * Brandon Corfman

  * Rebecca Jenkins

  * Dr. Michelle McGehee, through the maintenance network

  * Charles Jenkins, through his orders


  **Plot:** Rebecca corners Kristin and Brandon in person and makes her offer face to face. Charles''s purge order arrives in the middle of it. Brandon''s apparent acceptance gets them free. Kristin commits to sending the evidence or rescuing captives by acting on it, and Michelle then shows her a way to do both.'
outline:
- id: 2C.1
  anchor: scene-2c1--rebeccas-offer
  title: Rebecca’s Offer
  details:
  - command corridor
  - Rebecca in person
  - guards at both ends
  - offer to Brandon
  - Michelle's release
  prose: 'Rebecca has watched them since the camera turned toward Brandon in 2A. She comes herself. Guards hold both ends of the corridor. A camera over the guards has the same slow turn as the one at the manifold, and it stays on Brandon the whole time she talks.


    She makes her offer to Brandon in front of Kristin. Charles has become unstable, she says. He means to kill the prisoners and the lower-level conspirators once the new government is in place. If Brandon helps her remove Charles and take control of the Continuity Initiative, she will release Michelle.


    Kristin can speak, bluff, threaten or stay silent. Rebecca answers her, but she is negotiating with Brandon.'
- id: 2C.2
  anchor: scene-2c2--the-purge-order
  title: The Purge Order
  details:
  - Rebecca's tablet
  - purge order
  - corrupted JANUS records
  - her own people
  - Charles's broadcast
  - Brandon's yes
  prose: 'Mid-conversation, Rebecca''s tablet chimes. Charles has learned that Michelle''s network corrupted the JANUS records. He has ordered a full transfer of the most valuable captives and the destruction of everyone else. The purge begins within hours. The order includes Rebecca''s own staff. Her face changes.


    At the same time, Charles is preparing a national broadcast claiming he has found survivors of the catastrophe. He will release a few selected captives to give his new emergency government legitimacy.


    Brandon says yes to Rebecca. The guards stand down, and the corridor camera, which has held on him through the whole offer, swings back to its slow sweep. Rebecca has called off the watch. If Kristin looks up, she sees it let go; Brandon does not. Rebecca leaves for her office to move against Charles. Kristin cannot tell whether Brandon means it. If she refused to let him erase his name in 2B, he says yes coldly and avoids her eyes. If she let him, he glances at her as he says it.'
- id: 2C.3
  anchor: scene-2c3--evidence-or-rescue
  title: Evidence or Rescue
  details:
  - copied evidence
  - uplink
  - transfer carts
  - detention sectors
  - Kristin's commitment
  prose: 'Free in the corridor, with the purge running, Kristin has to act. There is no time to argue it out.


    A player who looks first learns what each choice will cost. The uplink has one outbound channel, and a monitor light beside it burns steady amber: the facility''s eye on its own traffic. Whatever goes out will be seen. Along the other wall the carts stand loaded and strapped, each with a tag on the rail. The tags carry a transfer date a week old and the closing code, sensor fault. If Kristin has seen the held transfers, she knows the code: these are the transfers that were held, and Charles''s order moves them first. If she also matched the ticket header in the archive, she knows who held them. Brandon says they must send the evidence now, even if that makes a rescue impossible. Kristin will not abandon Michelle and thousands of captives.


    Kristin commits by doing one of these:


    * **Transmit.** She heads for the uplink and starts sending the evidence. The outside world gets proof. The facility detects the transmission and seals the detention sectors.

    * **Rescue.** She heads for the transfer carts and frees one cart of captives before the guards react. Those prisoners are free, but nothing has been sent; the outside world still knows nothing.


    If she does neither before the purge alarm sounds, the alarm drives them from the corridor and nothing is gained or lost.'
- id: 2C.4
  anchor: scene-2c4--living-with-the-choice
  title: Living With the Choice
  details:
  - sealed detention sectors
  - freed captives
  - Brandon's guilt
  - Rebecca's offer
  - distrust
  prose: 'Whatever Kristin chose stays chosen. If she transmitted, the sectors are sealed and the evidence is out. If she rescued, the freed captives are with them and the evidence is still only in Kristin''s hands.


    Brandon''s yes to Rebecca still hangs between them. He may be buying time for the captives, or protecting himself. Kristin cannot know yet.'
- id: 2C.5
  anchor: scene-2c5--michelle-changes-the-choice
  title: Michelle Changes the Choice
  details:
  - coded message
  - maintenance network
  - holding block route
  - emergency broadcast system
  - Rebecca’s secured office
  - combined mission
  prose: 'Michelle''s second message arrives through the maintenance network, as she promised in the archive. It comes as a maintenance ticket on the nearest panel: the uplink''s status panel if Kristin went to the uplink, the cart''s latch display if she went to the carts, a wall panel if the alarm drove them out first. It carries the same ticket header and the same closing code, sensor fault, as the held transfers. Kristin, if she matched the header in the archive, knows whose it is. It marks a route into her partly unsecured holding block. It explains that the facility''s emergency broadcast system can transmit the evidence and open the sealed detention sectors at the same time.


    The broadcast system can only be activated by hand from Rebecca''s secured office.


    Michelle does not undo Kristin''s choice. Its cost and its gain carry forward. She widens the options into one far more dangerous combined mission.


    # Scene 3 — The Captives


    **Freytag Function:** Final rise, climax, falling action, and resolution


    **Central Plot:** Kristin, Brandon, and Michelle coordinate an uprising, expose the Continuity Initiative, and confront Charles and Rebecca as Charles turns a false emergency into a real flood.


    **Primary Characters:**


    * Kristin Schweitzer

    * Dr. Michelle McGehee

    * Brandon Corfman

    * Charles Jenkins

    * Rebecca Jenkins'
