brief: '**Setting:** Detention sectors and experimental laboratories within the facility


  **Characters:**


  * Kristin Schweitzer

  * Dr. Michelle McGehee

  * Brandon Corfman

  * Imprisoned senior official


  **Plot:** Kristin and Brandon descend into the detention levels while Michelle organizes the prisoners for an uprising.'
outline:
- id: 3A.1
  anchor: scene-3a1--the-detention-block
  title: The Detention Block
  details:
  - detention sector
  - rows of captives
  - scattered radios
  - secret messages
  - tightening security
  prose: 'Kristin follows Michelle''s maintenance route into one partly unsecured detention sector, not a mass release. She expects rows of helpless captives. Instead, Michelle speaks into a stolen radio, coordinating prisoners through secret messages and sympathetic facility workers.


    Michelle is beside the captives.


    They are awake. The dose they were given is for the trip, and it wears off in the detention block. Michelle says waking them was the easy part. Getting them to trust the announcements took longer.


    Each captive wears a plastic tag on the wrist, and every tag carries the same transfer date, a week old. They were all due out a week ago. They are alive because Michelle held them, one ticket at a time, from the medical terminal in the archive; she could reach nothing else. If Kristin has seen the held transfers, she knows the closing code on the tags, and she knows who wrote the tickets she could not place in 2B. If she freed a cart in 2C, the tags on the cart''s captives are the same.


    The stolen radios are tuned to the facility''s own loop, the same ninety seconds that played in the park and at the freight terminal. Michelle''s secret messages ride inside it and change one word. The captives know the loop by heart, and the guards have stopped hearing it, so it is the one voice upstairs does not listen to. That is how she taught them to trust a voice they could not see. When the loop stops, Michelle says, everyone will know.


    The reunion gets one unhurried moment before the purge countdown takes over again. Kristin and Michelle can speak to each other before anyone asks either of them for anything.


    Kristin''s choice in 2C shows here. If she freed a cart of captives, they came down with her, and they join Michelle''s people. If she transmitted the evidence, the upload is still running, the other sectors are sealed, and Michelle''s route was the only way in.


    Michelle explains that the facility contains only a fraction of the missing millions. Freeing them will matter only if the broadcast reveals the locations of the remaining sites. Michelle points toward the medical level, where the experiment records wait.'
- id: 3A.2
  anchor: scene-3a2--the-experiments
  title: The Experiments
  details:
  - medical level
  - neurological experiments
  - behavioral experiments
  - short-term memory
  - targeted stimulation
  - false recollections
  prose: 'Michelle leads Kristin through a medical level where prisoners have been subjected to neurological and behavioral experiments.


    Rebecca’s company has been testing methods for:


    * Erasing short-term memory

    * Increasing compliance through targeted stimulation

    * Creating convincing false recollections

    * Conditioning released captives to support official explanations

    * Predicting resistance before it occurs


    The people Charles intends to “rescue” during his broadcast have already been conditioned to endorse his version of events. The senior official waits among the government prisoners.


    Kristin has just seen what the program can do to a memory, and she cannot be sure what was done to Michelle. If she read the calendar in Michelle''s kitchen, she can ask for something no record holds. Michelle answers without a pause: Saturday, circled, K, lemon cake. Then she says she is sorry she missed the birthday. The facility never saw that wall. Kristin stops watching her for a flaw.'
- id: 3A.3
  anchor: scene-3a3--the-unexpected-prisoner
  title: The Unexpected Prisoner
  details:
  - senior official
  - government prisoners
  - fabricated evidence
  - authorization codes
  - emergency surface gates
  - Charles’s broadcast
  prose: 'Among the captives is a senior official publicly blamed for causing the catastrophe. He reveals that Charles imprisoned members of his own government and fabricated evidence against them.


    He possesses authorization codes that can release the facility''s emergency surface gates once, but the codes will expire when Charles’s new authority is formally activated.


    The rescue now has a strict deadline tied to Charles’s broadcast. Michelle turns toward the prisoners at the checkpoints.'
- id: 3A.4
  anchor: scene-3a4--the-uprising-begins
  title: The Uprising Begins
  details:
  - coordinated disturbances
  - disabled cameras
  - isolated guards
  - internal checkpoints
  - sealed primary exits
  - armed response teams
  prose: 'Michelle hands Kristin the stolen radio. Kristin gives the signal. Coordinated disturbances break out across the detention sectors. Prisoners disable cameras, overwhelm isolated guards, and seize control of several internal checkpoints.


    The uprising succeeds initially, but Charles seals the primary exits and redirects armed response teams toward the detention levels.


    At the first checkpoint the door still answers to a guard''s badge. Brandon does not wait for one. He runs a card through the reader, and the door opens on the first pass. Michelle''s people watch him instead of the door. It is the same ease he showed at the facility gate, when he said the readers check only three things.


    Kristin, Michelle, and Brandon must fight upward toward Rebecca’s office while the prisoners hold the lower levels.'
