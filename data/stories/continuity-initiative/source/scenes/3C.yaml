- id: sl_3c_a
  storylet_id: SL-3C-A
  title: Charles Tries to Reframe the Broadcast
  guidance:
    pressure_role: 'Once transmission begins, prevent the climax from becoming a passive upload: Charles contests credibility, and accumulated verifiable evidence lets Michelle answer him.'
    window:
