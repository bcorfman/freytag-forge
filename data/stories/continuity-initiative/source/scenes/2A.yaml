entry: 'One night in Brandon''s hideout had turned years of leaked Continuity Initiative documents into two inspector badges and a work order for a cooling-water fault. Now the badges had to work. Kristin and Brandon stood at the facility gate while a shift supervisor walked out to meet them, reading the work order with a frown. "Nobody scheduled you," he said. "If there is a fault, show me. The cooling manifold is just inside the gate. Put your hands on the lines, read the gauge, trace the vent, and tell me exactly what is failing." Brandon murmured, "This is your field, Kristin. Be precise."


  '
