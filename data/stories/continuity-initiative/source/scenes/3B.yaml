    delivery:
      source_kind: message
      source_entity: rebecca
      fallback_text: Charles locks down Rebecca's office and abandons Rebecca while he transfers control of the national network. Rebecca finally understands that she was expendable to him.
      cue_text: The executive screen still carries a remote channel marked Charles. Security doors are sealing around the room.
  brandon_confession_available:
    purpose: Brandon’s confession authenticating his JANUS role is available for the broadcast.
    delivery:
      source_kind: message
      source_entity: brandon
      fallback_text: Brandon transmits a confession before security can lock down the relay chamber. He admits his role in creating JANUS, and the statement helps authenticate Michelle's evidence.
      cue_text: A voice channel marked Brandon is queued beside the broadcast controls.
  evidence_gap_marked_site_list:
    purpose: Kristin missed copying Rebecca's marked site list when time ran out.
  detention_locations_secured:
    purpose: The protagonists have secured exact detention-site location information for the national broadcast without treating Rebecca’s claims as trusted merely because she offered them.
    delivery:
      source_kind: message
      source_entity: rebecca
      fallback_text: Rebecca offers the locations of every detention site in exchange for a chance to save herself. Her location data gives Kristin and Michelle the detention locations they need for the broadcast. Time runs out before Kristin can copy Rebecca's marked site list.
      cue_text: A marked site list lies beside Rebecca's national network controls.
      costs:
        evidence_gap_marked_site_list: true
  facility_destruction_threat:
    purpose: Charles has turned Kristin's false water emergency into a real deluge, making escape urgent.
  rebecca_experiment_approval_confronted:
    purpose: Rebecca's personal approval of the experiments has been confronted before her capture.
  relay_power_failing:
    purpose: The relay's power path is failing under Charles's countermeasures, shortening the time available to begin the broadcast.
