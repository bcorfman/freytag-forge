storylets:
- id: SL-1A-A
  scene_id: 1A
  title: The House Does Not Look Abandoned
  activation:
    scene_id: 1A
    conditions:
    - fact_id: sarah_abduction_suspicion
      equals: false
    pacing:
      earliest_seconds: 0
      target_seconds: 60
      latest_seconds: 120
      pressure_bias: normal_before_target; prefer_after_target; strongly_prefer_near_latest
  pressure_role: If Jeremiah searches slowly or treats the disappearance as generic chaos, foreground contradictory
    physical evidence so curiosity naturally tightens into abduction suspicion.
  realization_options:
  - id: SL-1A-A-R1
    dramatic_intent: Connect forced entry, blood, missing work materials, or localized disorder into a credible
      forced-removal theory.
    operations:
    - op: assert
      fact_id: sarah_abduction_suspicion
      value: true
    eligible_storylet_event_id: null
    helps_transition_triggers: []
    protected_knowledge_boundaries:
    - janus_selection_system
    - gabriel_history
    - phase_two
  - id: SL-1A-A-R2
    dramatic_intent: A hurried or partial inspection still makes one concrete contradiction impossible to dismiss,
      raising suspicion without identifying an abductor.
    operations:
    - op: assert
      fact_id: sarah_abduction_suspicion
      value: true
    eligible_storylet_event_id: null
    helps_transition_triggers: []
    protected_knowledge_boundaries:
    - janus_selection_system
    - gabriel_history
    - phase_two
  completion_or_abort:
    complete_when:
    - fact_id: sarah_abduction_suspicion
      equals: true
    - scene_transition_valid: t_1a_1b
    abort_when:
    - scene_id_not: 1A
  non_coercion_note: Offer as a consequence/opportunity inferred from free-text play. Do not present these realizations
    as choices, commands, or required actions; equivalent player-authored approaches may validate the same operations.
- id: SL-1A-B
  scene_id: 1A
  title: Sarah Hid Something for Jeremiah
  activation:
    scene_id: 1A
    conditions:
    - fact_id: continuity_initiative_known
      equals: false
    pacing:
      earliest_seconds: 0
      target_seconds: 60
      latest_seconds: 120
      pressure_bias: normal_before_target; prefer_after_target; strongly_prefer_near_latest
  pressure_role: When the player lingers in Sarah’s work area, let her preparation reward investigation and connect
    her disappearance to a deliberate threat rather than require a specific search command.
  realization_options:
  - id: SL-1A-B-R1
    dramatic_intent: Discover or securely recover Sarah’s evidence and infer that she expected targeted danger.
    operations:
    - op: assert
      fact_id: continuity_initiative_known
      value: true
    - op: assert
      fact_id: sarah_abduction_suspicion
      value: true
    - op: assert
      fact_id: sarah_lead_actionable
      value: true
    eligible_storylet_event_id: null
    helps_transition_triggers:
    - t_1a_1b
    protected_knowledge_boundaries:
    - janus_selection_system
    - gabriel_history
    - phase_two
  - id: SL-1A-B-R2
    dramatic_intent: Recover the damaged warning first; its interrupted ending plus the house evidence is enough
      to support abduction suspicion even before every file is understood.
    operations:
    - op: assert
      fact_id: sarah_warning_known
      value: true
    - op: assert
      fact_id: sarah_abduction_suspicion
      value: true
    eligible_storylet_event_id: null
    helps_transition_triggers: []
    protected_knowledge_boundaries:
    - janus_selection_system
    - gabriel_history
    - phase_two
  completion_or_abort:
    complete_when:
    - any_fact_true:
      - continuity_initiative_known
      - sarah_warning_known
    abort_when:
    - scene_id_not: 1A
  non_coercion_note: Offer as a consequence/opportunity inferred from free-text play. Do not present these realizations
    as choices, commands, or required actions; equivalent player-authored approaches may validate the same operations.
