  title: Is Brandon Hunter or Rescuer?
  activation:
    scene_id: 1B
    conditions: []
    pacing:
      earliest_seconds: 120
      target_seconds: 195
      latest_seconds: 270
      pressure_bias: normal_before_target; prefer_after_target; strongly_prefer_near_latest
  pressure_role: When the player resists trusting Brandon, let behavior under pressure earn only provisional cooperation
    while keeping his deeper history unresolved.
  realization_options:
  - id: SL-1B-B-R1
    dramatic_intent: Brandon intervenes against the patrol, identifies himself as Michelle’s contact, and credibly
      connects her transit clue to a route used by the removal operation without revealing the facility itself.
    operations:
    - op: assert
      fact_id: trust_brandon
      value: true
    - op: assert
      fact_id: brandon_identified
      value: true
    - op: assert
      fact_id: missing_may_be_alive
      value: true
    - op: assert
      fact_id: transport_route_identified
      value: true
    eligible_storylet_event_id: null
    helps_transition_triggers:
    - t_1b_1c
    protected_knowledge_boundaries:
    - brandon_history
    - janus_selection_system
    - phase_two
  - id: SL-1B-B-R2
    dramatic_intent: Kristin confronts him with the photograph; Brandon admits prior Initiative work and that the
      missing may still be alive, but withholds the protected JANUS role.
    operations:
    - op: assert
      fact_id: brandon_identified
