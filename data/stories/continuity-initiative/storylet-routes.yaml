schema_version: '1.1'
story_id: continuity_initiative
contract:
  canonical_scene_chain:
  - 1A
  - 1B
  - 1C
  - 2A
  - 2B
  - 2C
  - 3A
  - 3B
  - 3C
  sole_ending_scene_id: 3C
  free_text_player_input: true
  storylets_are_model_guidance_not_ui_choices: true
  durable_effects_require_validated_fact_operations: true
  transition_mutation_allowed: false
  canonical_beats_may_use_optional_storylets_as_realization_guidance: true
  pacing_events_must_create_observable_pressure_not_unearned_knowledge: true
  canonical_resolution_uses_optional_storylets_as_realization_guidance: true
pacing_event_review:
- event_id: pressure_1a
  scene_id: 1A
  at_turn: 4
  effect:
    op: assert
    fact_id: patrol_return_pressure
    value: true
  status: approved
  reason: Escalates an observable return threat at the house without revealing the later facility.
- event_id: pursuit_1b
  scene_id: 1B
  at_turn: 4
  effect:
    op: assert
    fact_id: pursuit_closing_in
    value: true
  status: approved
  reason: Makes the park pursuit visibly close in without resolving it.
- event_id: security_1c
  scene_id: 1C
  at_turn: 3
  effect:
    op: assert
    fact_id: terminal_security_escalating
    value: true
  status: approved
  reason: Makes security pressure at the terminal visibly escalate.
- event_id: scrutiny_2a
  scene_id: 2A
  at_turn: 3
  effect:
    op: assert
    fact_id: identity_scrutiny_visible
    value: true
  status: approved
  reason: Makes visible scrutiny of the inspector identity a timed pressure.
- event_id: collapse_3c
  scene_id: 3C
  at_turn: 4
  effect:
    op: assert
    fact_id: facility_collapse_escalating
    value: true
  status: approved
  reason: Makes Charles's emergency deluge visibly worsen during the escape.
- event_id: home_search_narrows_1a
  scene_id: 1A
  at_turn: 8
  effect: {op: assert, fact_id: home_search_window_narrowing, value: true}
  status: approved
  reason: Makes the patrol's widening search visible without forcing Kristin to leave before she has investigated her home.
- event_id: park_lockdown_1b
  scene_id: 1B
  at_turn: 8
  effect: {op: assert, fact_id: park_lockdown_spreading, value: true}
  status: approved
  reason: Turns the park pursuit into a shrinking physical space after the dead-drop and Brandon encounter have had room to play.
- event_id: terminal_sweep_1c
  scene_id: 1C
  at_turn: 7
  effect: {op: assert, fact_id: terminal_sweep_closing, value: true}
  status: approved
  reason: Gives the terminal investigation a second, observable pressure wave after the captives and logistics evidence are discovered.
- event_id: cover_review_2a
  scene_id: 2A
  at_turn: 7
  effect: {op: assert, fact_id: inspector_cover_under_review, value: true}
  status: approved
  reason: Keeps the infiltration tense by making a credential review concrete after the initial scrutiny.
- event_id: archive_sweep_2b
  scene_id: 2B
  at_turn: 8
  effect: {op: assert, fact_id: archive_security_sweep, value: true}
  status: approved
  reason: Gives Kristin time to confront Brandon before a visible archive audit begins to close the window.
- event_id: transfers_2c
  scene_id: 2C
  at_turn: 8
  effect: {op: assert, fact_id: purge_transfers_underway, value: true}
  status: approved
  reason: Shows the purge becoming real after the player has faced the evidence-versus-rescue conflict.
- event_id: detention_lockdown_3a
  scene_id: 3A
  at_turn: 8
  effect: {op: assert, fact_id: detention_lockdown_spreading, value: true}
  status: approved
  reason: Makes the uprising's delayed cost visible while still leaving time to organize it.
- event_id: relay_power_3b
  scene_id: 3B
  at_turn: 9
  effect: {op: assert, fact_id: relay_power_failing, value: true}
  status: approved
  reason: Adds a late, concrete limit to the relay mission after the office confrontation.
- event_id: routes_collapse_3c
  scene_id: 3C
  at_turn: 10
  effect: {op: assert, fact_id: escape_routes_collapsing, value: true}
  status: approved
  reason: Keeps the escape active after the broadcast contest and archive confrontation have had time to unfold.
new_fact_ids:
