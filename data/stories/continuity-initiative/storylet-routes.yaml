schema_version: '1.1'
story_id: continuity_initiative
contract:
  canonical_scene_chain:
  - 1A
  - 1B
  - 1C
  - 2A
  - 2B
  - 2C
  - 3A
  - 3B
  - 3C
  sole_ending_scene_id: 3C
  free_text_player_input: true
  storylets_are_model_guidance_not_ui_choices: true
  durable_effects_require_validated_fact_operations: true
  transition_mutation_allowed: false
  canonical_beats_may_use_optional_storylets_as_realization_guidance: true
  pacing_events_must_create_observable_pressure_not_unearned_knowledge: true
  canonical_resolution_uses_optional_storylets_as_realization_guidance: true
pacing_event_review:
- event_id: pressure_1a
  scene_id: 1A
  at_seconds: 120
  effect:
    op: assert
    fact_id: patrol_return_pressure
    value: true
  status: approved
  reason: Escalates an observable return threat at the house without revealing the later facility.
