storylets:
- id: SL-1A-A
  scene_id: 1A
  title: The House Does Not Look Abandoned
  activation:
    scene_id: 1A
    conditions:
    - fact_id: michelle_abduction_suspicion
      equals: false
    pacing:
      earliest_turn: 0
      target_turn: 2
      latest_turn: 3
      pressure_bias: normal_before_target; prefer_after_target; strongly_prefer_near_latest
  pressure_role: If Kristin searches slowly or treats the disappearance as generic chaos, foreground contradictory
    physical evidence so curiosity naturally tightens into abduction suspicion.
  realization_options:
  - id: SL-1A-A-R1
    dramatic_intent: Connect forced entry, blood, missing work materials, or localized disorder into a credible
      forced-removal theory.
    operations:
    - op: assert
      fact_id: michelle_abduction_suspicion
      value: true
    eligible_storylet_event_id: null
    helps_transition_triggers: []
    protected_knowledge_boundaries:
    - janus_selection_system
    - brandon_history
    - phase_two
  completion_or_abort:
    complete_when:
    - fact_id: michelle_abduction_suspicion
      equals: true
    - scene_transition_valid: t_1a_1b
    abort_when:
    - scene_id_not: 1A
  non_coercion_note: Offer as a consequence/opportunity inferred from free-text play. Do not present these realizations
    as choices, commands, or required actions; equivalent player-authored approaches may validate the same operations.
- id: SL-1A-B
  scene_id: 1A
  title: Michelle Hid Something for Kristin
  activation:
    scene_id: 1A
    conditions:
    - fact_id: continuity_initiative_known
      equals: false
    pacing:
      earliest_turn: 2
      target_turn: 5
      latest_turn: 6
      pressure_bias: normal_before_target; prefer_after_target; strongly_prefer_near_latest
  pressure_role: When the player lingers in Michelle’s work area, let her preparation reward investigation and connect
    her disappearance to a deliberate threat rather than require a specific search command.
  realization_options:
  - id: SL-1A-B-R1
    dramatic_intent: Find and secure Michelle's hidden memory card first, then read its files and damaged recording; the card points to a dead drop at a bench in the park, giving Kristin a concrete lead away from the house.
    operations:
    - op: assert
      fact_id: memory_card_in_kristins_custody
      value: true
    - op: assert
      fact_id: continuity_initiative_known
      value: true
    - op: assert
      fact_id: michelle_abduction_suspicion
      value: true
    - op: assert
      fact_id: michelle_warning_known
      value: true
    - op: assert
      fact_id: michelle_lead_actionable
      value: true
    eligible_storylet_event_id: null
    helps_transition_triggers:
    - t_1a_1b
    protected_knowledge_boundaries:
    - janus_selection_system
    - brandon_history
    - phase_two
  - id: SL-1A-B-R2
    dramatic_intent: Find and secure Michelle's hidden memory card first, then play its damaged warning; its interrupted
      ending plus the house evidence is enough to support abduction suspicion even before every file is understood.
    operations:
    - op: assert
      fact_id: memory_card_in_kristins_custody
      value: true
    - op: assert
      fact_id: michelle_warning_known
      value: true
    - op: assert
      fact_id: michelle_abduction_suspicion
      value: true
    eligible_storylet_event_id: null
    helps_transition_triggers: []
    protected_knowledge_boundaries:
    - janus_selection_system
    - brandon_history
    - phase_two
  completion_or_abort:
    complete_when:
    - any_fact_true:
      - continuity_initiative_known
      - michelle_warning_known
    abort_when:
    - scene_id_not: 1A
  non_coercion_note: Offer as a consequence/opportunity inferred from free-text play. Do not present these realizations
    as choices, commands, or required actions; equivalent player-authored approaches may validate the same operations.
- id: SL-1A-C
  scene_id: 1A
  title: The Welfare Check Feels Like a Search
  activation:
    scene_id: 1A
    conditions:
    - fact_id: michelle_warning_known
      equals: true
    pacing:
      earliest_turn: 4
      target_turn: 6
      latest_turn: 7
      pressure_bias: normal_before_target; prefer_after_target; strongly_prefer_near_latest
  pressure_role: If Kristin stalls after finding evidence, official scrutiny raises urgency and makes staying costly
    without dictating whether she hides, lies, argues, or leaves.
  realization_options:
  - id: SL-1A-C-R1
    dramatic_intent: Observe that the patrol is specifically interested in Dr. McGehee’s research; this corroborates
      targeted removal without revealing who ordered it.
    operations:
    - op: assert
      fact_id: official_interest_in_michelle_known
      value: true
    - op: assert
      fact_id: michelle_abduction_suspicion
      value: true
    eligible_storylet_event_id: null
    helps_transition_triggers: []
    protected_knowledge_boundaries:
    - janus_selection_system
    - brandon_history
    - phase_two
  - id: SL-1A-C-R2
    dramatic_intent: Notice the gate marker after the patrol leaves, establishing a concrete return threat and a
      reason to move on.
    operations:
