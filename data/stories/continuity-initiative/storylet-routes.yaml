audit_notes:
- Bridge facts that summarize scene completion are produced only by gated canonical events, preventing one early
  optional storylet from skipping later core beats.
- The damaged warning in 1A no longer counts as an actionable park lead by itself.
- The 1B departure bridge now requires Brandon’s identity/warning and a resolved pursuit in addition to the transport
  lead.
- Scene 2B now preserves the JANUS, bait, Brandon, and Michelle-resistance reversals before transition.
- Scene 3A requires the reunion, experiment stakes, override-code deadline, and uprising before the assault moves
  upward; securing the codes themselves remains optional.
- Scene 3B now preserves JANUS defeat, Rebecca/Charles fracture, exact detention locations, Brandon’s confession,
  and the relay opening before the broadcast begins.
- Canonical 3C resolution events guarantee Rebecca’s capture, Charles remaining at large, network fragmentation,
  and the Phase Two reveal even if the optional epilogue storylets are not selected.
