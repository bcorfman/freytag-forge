schema_version: '2.0'
facts:
- id: michelle_abduction_suspicion
  purpose: 'Canonical world state: michelle abduction suspicion.'
- id: facility_proof
  purpose: 'Canonical world state: facility proof.'
- id: false_identities_ready
  purpose: 'Canonical world state: false identities ready.'
- id: janus_evidence
  purpose: 'Canonical world state: janus evidence.'
- id: purge_clock_started
  purpose: 'Canonical world state: purge clock started.'
- id: michelle_reached
  purpose: 'Canonical world state: michelle reached.'
- id: relay_open
  purpose: 'Canonical world state: relay open.'
- id: broadcast_started
  purpose: 'Canonical world state: broadcast started.'
- id: continuity_initiative_known
  purpose: Kristin knows Michelle’s research into genetics led her to investigate suspicious
    secret contracts tied to the Continuity Initiative.
- id: michelle_warning_known
  purpose: Kristin has recovered Michelle’s warning not to trust emergency broadcasts.
- id: official_interest_in_michelle_known
  purpose: Kristin knows the welfare patrol was specifically interested in Michelle’s
    research and findings.
- id: house_marked_for_return
  purpose: The McGehee home has been marked by the patrol for a likely return.
- id: transport_route_identified
  purpose: Kristin and Brandon have enough evidence to follow the removal operation’s
    physical transport route toward a specific industrial/freight destination.
- id: brandon_face_known
  purpose: Kristin recognizes Brandon as the unidentified man in Michelle’s photograph.
- id: brandon_identified
  purpose: Kristin knows the follower is Brandon Corfman, Michelle’s contact.
- id: missing_may_be_alive
  purpose: Kristin has credible reason to believe at least some missing people are
    alive.
- id: brandon_retains_system_access
  purpose: Kristin has observed Brandon using retained Continuity-system access.
- id: service_level_access_known
  purpose: Kristin and Brandon know a credible service-level route into the regional
    facility.
- id: captives_confirmed_alive
  purpose: Kristin has directly confirmed living captives inside the regional facility.
- id: michelle_possible_sighting
  purpose: Kristin has an obscured, unconfirmed possible sighting of Michelle inside
    the facility.
- id: national_detention_network_known
  purpose: Kristin knows the Los Angeles site is part of a national detention network.
- id: architects_strategy_known
  purpose: Kristin knows Charles and Rebecca intend to leverage the manufactured
    catastrophe for political reconstruction/control.
- id: brandon_prepared_before_event
  purpose: Kristin knows Brandon prepared for the disappearance before it occurred.
- id: restricted_corridor_access
  purpose: Kristin and Brandon have access to restricted infrastructure corridors.
- id: rebecca_observing_infiltrators
  purpose: Rebecca has quietly ordered the infiltrators observed; this fact is not
    automatically known to Kristin.
- id: kristin_deliberately_left_behind
  purpose: JANUS records show Kristin was deliberately left behind.
- id: brandon_janus_role_known
  purpose: Kristin knows Brandon wrote JANUS AI software to identify threats.
- id: brandon_claimed_reform_motive
  purpose: Brandon has claimed he broke with Charles after learning JANUS would be
    used for mass detention/control.
- id: michelle_resistance_known
  purpose: Kristin knows Michelle is actively sabotaging the facility from inside.
- id: rebecca_offer_active
  purpose: Rebecca has offered Brandon safety/Michelle’s release in exchange for helping
    her displace Charles.
- id: antagonist_split_known
  purpose: Kristin has legitimate evidence that Rebecca and Charles are in conflict.
- id: combined_broadcast_rescue_plan_known
  purpose: Kristin/Brandon know Michelle’s plan to combine evidence transmission with
    opening detention sectors via Rebecca’s office.
- id: uprising_prepared
  purpose: Kristin knows Michelle has organized an active prisoner resistance network.
- id: conditioned_release_plan_known
  purpose: Kristin knows selected captives were being conditioned to support Charles’s
    public explanation.
- id: behavioral_experiments_known
  purpose: Kristin knows the facility conducted the authored neurological/behavioral
    experiments.
- id: military_override_codes_available
  purpose: The resistance has secured or reliably relayed the emergency military override
    codes.
- id: human_security_control
  purpose: JANUS can no longer reliably predict the group’s route and human operators
    have taken direct control.
- id: detention_locations_offer_known
  purpose: Rebecca has offered detention-site location information as leverage.
- id: charles_abandoned_rebecca
  purpose: Charles has stripped Rebecca of local control and treated her as expendable.
- id: brandon_confession_available
  purpose: Brandon’s confession authenticating his JANUS role is available for the
    broadcast.
- id: truth_no_longer_containable
  purpose: Enough independently verifiable evidence is public that Charles cannot
    contain the conspiracy by controlling one channel.
- id: portable_archive_secured
  purpose: The portable archive has been recovered from Rebecca’s sole control.
- id: archive_contains_prisoner_locations
  purpose: The recovered archive is known to contain prisoner locations as well as
    conspirator identities.
- id: archive_copies_distributed
  purpose: Copies of the archive have been distributed to independent networks.
- id: evacuation_route_open
  purpose: A viable evacuation path from the collapsing facility is open.
- id: captives_reaching_surface
  purpose: Surviving captives are reaching the surface.
- id: los_angeles_facility_lost
  purpose: The Los Angeles facility is no longer a viable concealed Continuity operation.
- id: national_network_fragmenting
  purpose: Public reports show the national detention network is fragmenting.
- id: community_rescue_efforts_begun
  purpose: Communities/families have begun independent rescue efforts.
- id: phase_one_label_known
  purpose: The disappearance operation is known to have been labeled Phase One.
- id: phase_two_conflict_plan_known
  purpose: The recovered JANUS material states Phase Two was designed to provoke conflict
    among those who remained.
- id: charles_at_large
  purpose: Charles remains at large after the Los Angeles exposure.
- id: michelle_lead_actionable
  purpose: Kristin has a concrete, credible lead from Michelle’s research that
    can be followed away from the house.
- id: patrol_return_pressure
  purpose: Observable signs indicate the federal patrol is likely to return or intensify
    scrutiny at the McGehee home.
- id: facility_infiltration_needed
  purpose: Kristin and Brandon understand that direct rescue or observation is insufficient
    and that controlled deeper access to the facility is necessary.
- id: detention_uprising_started
  purpose: Michelle’s resistance has openly begun coordinated action and the protagonists
    are committed to moving toward the command/broadcast levels.
- id: park_pursuit_resolved
  purpose: Kristin and Brandon have survived or otherwise resolved the park pursuit
    and can depart together.
- id: transport_route_departure_ready
  purpose: Kristin and Brandon have the transport lead, have resolved the park pursuit,
    and can proceed to the industrial destination.
- id: archive_crisis_understood
  purpose: Kristin has secured JANUS evidence, learned the bait/Brandon revelations,
    and recognized Michelle’s active resistance, completing the archive crisis.
- id: override_codes_deadline_known
  purpose: Kristin and Michelle understand that the senior official’s emergency override
    authorization will expire when Charles activates his new authority, whether or
    not the codes are secured.
- id: command_levels_assault_underway
  purpose: Michelle’s uprising is active and the protagonists are moving from the detention
    levels toward the command/broadcast levels.
- id: detention_locations_secured
  purpose: The protagonists have secured exact detention-site location information
    for the national broadcast without treating Rebecca’s claims as trusted merely
    because she offered them.
- id: rebecca_captured
  purpose: Rebecca has been captured and no longer controls the portable archive or
    the local operation.
- id: resolution_complete
  purpose: 'The canonical 3C resolution has landed: exposure is durable, captives
    are escaping, the network is fragmenting, Charles remains at large, and Phase
    Two has been revealed.'
- id: michelle_publishing_archive
  purpose: Michelle has begun distributing/publishing the Continuity Initiative archive
    after the exposure.
- id: kristin_joined_rescue_efforts
  purpose: Kristin has committed to helping locate and open remaining detention facilities.
- id: scene_1a_entry_known
  purpose: The safe opening frame for scene 1A has been established.
- id: scene_1b_entry_known
  purpose: The safe opening frame for scene 1B has been established.
- id: scene_1c_entry_known
  purpose: The safe opening frame for scene 1C has been established.
- id: scene_2a_entry_known
  purpose: The safe opening frame for scene 2A has been established.
- id: scene_2b_entry_known
  purpose: The safe opening frame for scene 2B has been established.
- id: scene_2c_entry_known
  purpose: The safe opening frame for scene 2C has been established.
- id: scene_3a_entry_known
  purpose: The safe opening frame for scene 3A has been established.
- id: scene_3b_entry_known
  purpose: The safe opening frame for scene 3B has been established.
- id: scene_3c_entry_known
  purpose: The safe opening frame for scene 3C has been established.
scene_frames:
- scene_id: 1A
  situation: The house is too quiet. Michelle's phone lies facedown on the kitchen floor
    beside an overturned chair, while her laptop and work bag are gone.
  pressure: Find evidence of Michelle's disappearance
- scene_id: 1B
  situation: Enter 1B
  pressure: Follow Michelle's lead and survive the park
- scene_id: 1C
  situation: Enter 1C
  pressure: Confirm the facility and its purpose
- scene_id: 2A
  situation: Enter 2A
  pressure: Enter the facility under false identities
- scene_id: 2B
  situation: Enter 2B
  pressure: Secure evidence while judging Brandon's betrayal
- scene_id: 2C
  situation: Enter 2C
  pressure: Survive the purge clock and choose a combined mission
- scene_id: 3A
  situation: Enter 3A
  pressure: Reach Michelle and join the uprising
- scene_id: 3B
  situation: Enter 3B
  pressure: Overload JANUS and seize the broadcast
- scene_id: 3C
  situation: Enter 3C
  pressure: Expose the network and escape
