schema_version: 1
scope: core
rules:
  - rule_id: move_actor
    when:
      all:
        - predicate: path
          args: ["$direction", "$from", "$to"]
        - predicate: at
          args: ["$actor", "$from"]
      not:
        - predicate: locked
          args: ["$direction", "$from", "$key"]
    then:
      retract:
        - [at, "$actor", "$from"]
      assert:
        - [at, "$actor", "$to"]
  - rule_id: take_item
    when:
      all:
        - predicate: at
          args: ["$actor", "$room"]
        - predicate: room_item
          args: ["$room", "$item"]
    then:
      retract:
        - [room_item, "$room", "$item"]
      assert:
        - [holding, "$actor", "$item"]
  - rule_id: observation_exposes_entity
    when:
      all:
        - predicate: observed
          args: ["$observer", "$entity"]
        - predicate: exposed
          args: ["$entity", "$room"]
    then:
      assert:
        - [visible, "$observer", "$entity"]
  - rule_id: interpreted_evidence_is_discovered
    when:
      all:
        - predicate: observed
          args: ["$observer", "$entity"]
        - predicate: interpreted
          args: ["$observer", "$entity", "$interpretation"]
    then:
      assert:
        - [discovery, "$observer", "$entity", "$interpretation"]
  - rule_id: sensory_propagation_carries_trace
    when:
      all:
        - predicate: sensory_propagation
          args: ["$from", "$to", "$mode"]
        - predicate: trace
          args: ["$entity", "$from", "$condition"]
    then:
      assert:
        - [trace, "$entity", "$to", "$condition"]
