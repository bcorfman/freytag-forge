schema_version: story-blueprint-v1
id: vale_mansion_case
version: 1
source_outline:
  id: vale_mansion_outline
  content_hash: 8c5a1cc8aed807be6e486069825721699d57f3b1764d8d594bcb90ba7ab2c961
genre: mystery
title: The Vale Mansion Case
premise: >-
  Detective Elias Wren must establish how Emma Vale died before the household
  converts suspicion of the groundskeeper into an irreversible false accusation.
central_question: >-
  Can Elias prove who killed Emma Vale, why, and how before the wrong person is blamed?
canonical_truths:
  - {id: suspicious_death, summary: Emma Vale's death is suspicious rather than an accident.}
  - {id: payment_trail, summary: A diverted payment links the killer to Emma's audit.}
  - {id: groundskeeper_alibi, summary: The groundskeeper's delivery records and witness account clear the apparent opportunity.}
  - {id: perpetrator_identity, summary: Estate solicitor Beatrice Harrow killed Emma Vale.}
  - {id: motive, summary: Emma discovered Harrow had diverted restoration payments through a shell account.}
  - {id: means, summary: Harrow used a brass letter opener from the study to inflict the fatal wound.}
  - {id: opportunity, summary: "Harrow met Emma alone in the west gallery between 23:42 and 23:50."}
  - {id: method, summary: Harrow staged the wound and broken window as an intrusion after the killing.}
  - {id: time_window, summary: "The murder occurred in the bounded 23:42 to 23:50 west-gallery window."}
  - {id: concealment, summary: Harrow moved the ledger leaf and planted muddy boots near the service gate.}
  - {id: crime_solution, summary: "Evidence establishes Harrow's means, motive, opportunity, method, and concealment."}
genre_causality:
  - {role: crime_solution, truth_id: crime_solution}
  - {role: victim, truth_id: suspicious_death}
  - {role: perpetrator, truth_id: perpetrator_identity}
  - {role: motive, truth_id: motive}
  - {role: means, truth_id: means}
  - {role: opportunity, truth_id: opportunity}
  - {role: method, truth_id: method}
  - {role: time_window, truth_id: time_window}
  - {role: concealment, truth_id: concealment}
protected_facts:
  - {id: harrow_is_killer, truth_id: perpetrator_identity, release_after: [establish_harrow_case]}
  - {id: complete_case_answer, truth_id: crime_solution, release_after: [decide_case_outcome]}
participant_knowledge:
  - {party_id: elias_wren, known_truths: []}
  - {party_id: daria_stone, known_truths: [suspicious_death]}
  - {party_id: groundskeeper, known_truths: [groundskeeper_alibi]}
  - {party_id: beatrice_harrow, known_truths: [payment_trail, perpetrator_identity, motive, means, opportunity, method, time_window, concealment]}
  - {party_id: estate_clerk, known_truths: [payment_trail]}
  - {party_id: kitchen_witness, known_truths: [groundskeeper_alibi]}
location_classes:
  - {id: public_interior, summary: "Rooms witnesses may enter openly, including the foyer and drawing room."}
  - {id: private_records, summary: "Controlled paper stores, including Emma's study and the estate office."}
  - {id: service_access, summary: "Staff-only routes, including the service corridor, potting shed, and service gate."}
  - {id: crime_scene, summary: The west gallery and its immediately observable approaches.}
evidence_placements:
  - {id: case_file, truth_id: suspicious_death, custody: Daria Stone holds the initial case file, location_classes: [public_interior]}
  - {id: ledger_leaf, truth_id: payment_trail, custody: Hidden in the study desk or estate office register, location_classes: [private_records]}
  - {id: delivery_log, truth_id: groundskeeper_alibi, custody: Groundskeeper's work ledger or kitchen dispatch book, location_classes: [service_access, public_interior]}
  - {id: letter_opener_trace, truth_id: means, custody: Study display case or west-gallery carpet, location_classes: [private_records, crime_scene]}
  - {id: gallery_clock, truth_id: opportunity, custody: West gallery clock mechanism or witness recollection, location_classes: [crime_scene, public_interior]}
  - {id: planted_boots, truth_id: concealment, custody: Service-gate mud or potting-shed wash basin, location_classes: [service_access]}
revelations:
  - id: death_is_suspicious
    role: discovery
    summary: Emma's injuries and the staged window make the death a suspicious killing.
    completion_conditions: [suspicious_death]
  - id: payment_trail_matters
    role: discovery
    summary: The missing restoration payment gives the death a financial motive.
    prerequisite_revelations: [death_is_suspicious]
    completion_conditions: [payment_trail]
  - id: groundskeeper_accusation_unsound
    role: exonerate_party
    subject_role: groundskeeper
    summary: The groundskeeper's apparent opportunity is a planted narrative, not proof.
    prerequisite_revelations: [payment_trail_matters]
    completion_conditions: [groundskeeper_alibi]
  - id: exclude_false_culprit_theory
    role: exonerate_party
    subject_role: perpetrator
    summary: The same alibi evidence removes the household's false culprit theory before a supported identification.
    prerequisite_revelations: [payment_trail_matters]
    completion_conditions: [groundskeeper_alibi]
    required: false
  - id: establish_harrow_case
    role: identify_party
    subject_role: perpetrator
    summary: Independent evidence establishes Harrow's means, motive, and opportunity.
    prerequisite_revelations: [groundskeeper_accusation_unsound]
    completion_conditions: [perpetrator_identity]
    protected_facts: [harrow_is_killer]
  - id: decide_case_outcome
    role: decision
    summary: Elias can accuse Harrow and decide the case outcome from committed evidence.
    prerequisite_revelations: [establish_harrow_case]
    completion_conditions: [crime_solution]
    protected_facts: [complete_case_answer]
realization_routes:
  - id: review_case_file
    revelation_id: death_is_suspicious
    role: document
    satisfiers: [{truth_id: suspicious_death, operator: establish}]
    location_classes: [public_interior]
    failure_forward: {result_truths: [suspicious_death]}
  - id: inspect_gallery_staging
    revelation_id: death_is_suspicious
    role: physical_evidence
    satisfiers: [{truth_id: suspicious_death, operator: establish}]
    location_classes: [crime_scene]
    failure_forward: {result_truths: [suspicious_death]}
  - id: find_ledger_leaf
    revelation_id: payment_trail_matters
    role: document
    satisfiers: [{truth_id: payment_trail, operator: establish}]
    availability_constraints: [suspicious_death]
    location_classes: [private_records]
    failure_forward: {result_truths: [payment_trail]}
  - id: question_estate_clerk
    revelation_id: payment_trail_matters
    role: testimony
    satisfiers: [{truth_id: payment_trail, operator: establish}]
    availability_constraints: [suspicious_death]
    location_classes: [public_interior]
    failure_forward: {result_truths: [payment_trail]}
  - id: inspect_delivery_log
    revelation_id: groundskeeper_accusation_unsound
    role: document
    satisfiers: [{truth_id: groundskeeper_alibi, operator: establish}]
    availability_constraints: [payment_trail]
    location_classes: [service_access, public_interior]
    failure_forward: {result_truths: [groundskeeper_alibi]}
  - id: question_kitchen_witness
    revelation_id: groundskeeper_accusation_unsound
    role: testimony
    satisfiers: [{truth_id: groundskeeper_alibi, operator: establish}]
    availability_constraints: [payment_trail]
    location_classes: [public_interior]
    failure_forward: {result_truths: [groundskeeper_alibi]}
  - id: check_service_dispatch
    revelation_id: exclude_false_culprit_theory
    role: document
    satisfiers: [{truth_id: groundskeeper_alibi, operator: establish}]
    availability_constraints: [payment_trail]
    location_classes: [service_access, public_interior]
    failure_forward: {result_truths: [groundskeeper_alibi]}
  - id: inspect_gate_wash_basin
    revelation_id: exclude_false_culprit_theory
    role: physical_evidence
    satisfiers: [{truth_id: groundskeeper_alibi, operator: establish}]
    availability_constraints: [payment_trail]
    location_classes: [service_access]
    failure_forward: {result_truths: [groundskeeper_alibi]}
  - id: recover_letter_opener_trace
    revelation_id: establish_harrow_case
    role: physical_evidence
    satisfiers:
      - {truth_id: perpetrator_identity, operator: establish}
      - {truth_id: motive, operator: establish}
      - {truth_id: means, operator: establish}
      - {truth_id: opportunity, operator: establish}
      - {truth_id: method, operator: establish}
      - {truth_id: time_window, operator: establish}
      - {truth_id: concealment, operator: establish}
    availability_constraints: [groundskeeper_alibi]
    location_classes: [private_records, crime_scene]
    failure_forward: {result_truths: [perpetrator_identity]}
  - id: reconcile_harrow_accounts
    revelation_id: establish_harrow_case
    role: document
    satisfiers:
      - {truth_id: perpetrator_identity, operator: establish}
      - {truth_id: motive, operator: establish}
      - {truth_id: means, operator: establish}
      - {truth_id: opportunity, operator: establish}
      - {truth_id: method, operator: establish}
      - {truth_id: time_window, operator: establish}
      - {truth_id: concealment, operator: establish}
    availability_constraints: [groundskeeper_alibi]
    location_classes: [private_records]
    failure_forward: {result_truths: [perpetrator_identity]}
  - id: present_physical_case
    revelation_id: decide_case_outcome
    role: decision
    satisfiers: [{truth_id: crime_solution, operator: establish}]
    availability_constraints: [perpetrator_identity, motive, means, opportunity, method, concealment]
    location_classes: [public_interior]
    failure_forward: {result_truths: [crime_solution]}
  - id: confront_harrow_with_accounts
    revelation_id: decide_case_outcome
    role: testimony
    satisfiers: [{truth_id: crime_solution, operator: establish}]
    availability_constraints: [perpetrator_identity, motive, means, opportunity, method, concealment]
    location_classes: [public_interior, private_records]
    failure_forward: {result_truths: [crime_solution]}
required_beats:
  - {id: suspicious_opening, phase: disruption, role: disruption, question: "What makes Emma's death urgent?", required_outcome: suspicious_death, revelation_dependencies: [death_is_suspicious], pressure_change: 1, pacing: 1}
  - {id: payment_reversal, phase: midpoint_reversal, role: reversal, question: "Why does the payment trail change the case?", required_outcome: payment_trail, revelation_dependencies: [payment_trail_matters], pressure_change: 1, pacing: 2}
  - {id: prevent_false_accusation, phase: crisis, role: crisis, question: "Can Elias stop an unsupported accusation?", required_outcome: groundskeeper_alibi, revelation_dependencies: [groundskeeper_accusation_unsound], pressure_change: 2, pacing: 3}
  - {id: prove_harrow_case, phase: climax, role: climax, question: "Can Elias prove who killed Emma and why?", required_outcome: perpetrator_identity, revelation_dependencies: [establish_harrow_case, decide_case_outcome], pressure_change: 2, pacing: 4}
  - {id: decide_vale_case, phase: resolution, role: resolution, question: "Can Elias prove who killed Emma and why?", required_outcome: crime_solution, revelation_dependencies: [decide_case_outcome], pressure_change: -1, pacing: 5}
optional_beats:
  - {id: storm_contaminates_gate_trace, phase: resolution, role: complication, narrative_function: Rain threatens the planted-boot trace but exposes a wash-basin residue, optional_purpose: complication, pressure_change: 1, pacing: 2}
opposition_clocks:
  - {id: household_pressure, summary: "The household presses for a quick accusation as the storm erases traces.", opportunity_decay: 1, max_ticks: 6}
end_states:
  - id: harrow_held_accountable
    summary: Harrow is accused from committed evidence and the groundskeeper is no longer blamed.
    required_truths: [payment_trail, groundskeeper_alibi, perpetrator_identity, motive, means, opportunity, method, concealment, crime_solution]
    required_revelations: [death_is_suspicious, payment_trail_matters, groundskeeper_accusation_unsound, establish_harrow_case, decide_case_outcome]
    answers_central_question: true
