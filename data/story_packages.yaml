schema_version: 1

# Authoring templates expanded and validated by world_builder.
default: &default
  room_presentation_template:
    name: "{room_title}"
    description: "{room_title} is arranged for close inspection, with practical routes and details shaped by the current situation."
  characters:
    traits: [observant, independent]
    appearance: "A distinct, scene-appropriate figure."
    role: contact
    relationship: arrives_with_the_player
    scene_purpose: "Offer a relevant perspective on the opening situation."
    initial_knowledge: [public_briefing]
    protected_knowledge: []
  items:
    affordances: [examine, take, give, use]
    initial_state: available
    document_visibility: discoverable
  opening_setup:
    arrival_order: [player, opening_contact]
    public_briefing: [opening_situation]
    pending_knowledge: [local_context]
    protected_knowledge: [future_revelations]
  goals:
    setup: "Survey the situation, confirm a first lead, and choose a concrete next action."
    primary: "Define and confront the core conflict while preserving viable paths forward."
  intent_aliases:
    examine: [inspect, study, look at]
    communicate: [ask, tell, speak with]
    movement: [go, walk, follow]
  effect_templates:
    examine: {family: discovery, bounded: true}
    communicate: {family: relationship, bounded: true}
    movement: {family: location, bounded: true}

packages:
  mystery:
    <<: *default
    map:
      rooms: [front_steps, foyer, market_lane, records_office, safehouse, watch_tower, old_chapel]
      paths:
        - {id: mansion_entrance, label: mansion entrance, from: front_steps, to: foyer, aliases: [front door, enter the mansion, inside]}
        - {id: drive_return, label: drive, from: foyer, to: front_steps, aliases: [outside, back outside, return to the drive]}
        - {id: lane_door, label: market-lane door, from: foyer, to: market_lane, aliases: [market lane, lane door]}
        - {id: foyer_return, label: mansion foyer, from: market_lane, to: foyer, aliases: [foyer, return to the mansion]}
        - {id: records_stair, label: records-office stair, from: market_lane, to: records_office, aliases: [records office, records]}
        - {id: lane_return, label: market lane, from: records_office, to: market_lane, aliases: [market lane, return to the lane]}
        - {id: service_passage, label: service passage, from: records_office, to: safehouse, aliases: [service passage, safehouse]}
        - {id: records_return, label: records office, from: safehouse, to: records_office, aliases: [records office, return to records]}
        - {id: tower_stair, label: watchtower stair, from: safehouse, to: watch_tower, aliases: [watchtower, watch tower]}
        - {id: safehouse_return, label: safehouse, from: watch_tower, to: safehouse, aliases: [safehouse, return to the safehouse]}
        - {id: chapel_path, label: old-chapel path, from: watch_tower, to: old_chapel, aliases: [old chapel, chapel]}
        - {id: tower_return, label: watchtower, from: old_chapel, to: watch_tower, aliases: [watchtower, watch tower]}
      room_presentation:
        front_steps:
          name: Outside The Mansion
          description: Broad stone steps rise to a carved oak door framed by weathered columns. A brass lantern burns beside the entrance and fresh mud marks the path from the street.
        foyer:
          name: Mansion Foyer
          description: The foyer opens beneath a dim chandelier, with wet tiles, shuttered portraits, and a long hall ahead. The upper gallery stays dark above the entry.
      environment:
        front_steps: {exposure: outdoor, ambient_source: the drive}
        foyer: {exposure: sheltered, ambient_source: the drive}
        market_lane: {exposure: outdoor, ambient_source: the lane}
        records_office: {exposure: enclosed}
        safehouse: {exposure: enclosed}
        watch_tower: {exposure: sheltered}
        old_chapel: {exposure: enclosed}
    characters:
      traits: [observant, independent]
      appearance: "A distinct, scene-appropriate figure."
      role: contact
      relationship: arrives_with_the_player
      scene_purpose: "Offer a relevant perspective on the opening situation."
      initial_knowledge: [public_briefing]
      protected_knowledge: []
      opening_contact:
        id: daria_stone
        name: Daria Stone
        location: front_steps
        pronouns: she/her
        appearance: a crisp white blouse and a tailored black skirt with dark hair pulled back into a neat bun
        description: Daria Stone watches the situation carefully in a crisp white blouse and a tailored black skirt with dark hair pulled back into a neat bun.
        role: assistant
        relationship: assistant
        scene_purpose: Review the case file privately, out of earshot; first give the public outline at the threshold.
        initial_knowledge: [opening_situation, ledger_entry_time]
        protected_knowledge: [case_file_contents]
    items: [case_file, ledger_page, route_key, arrival_sedan]
    item_details:
      case_file:
        kind: tool
        clue_text: The case file records the public timeline and a time-stamped ledger entry that narrows it.
        initial_custody: {kind: npc, id: daria_stone}
        readable:
          aliases: [case file, file]
          discovery: case_file
          knowledge: [victim_name, victim_timeline, lead_suspect, strongest_lead, ledger_entry_time]
          npc_disclosures: {daria_stone: [ledger_entry_time]}
          leads: [The strongest documented lead is a missing ledger payment tied to the mansion and tonight's visit.]
          context:
            case_file_status: You have reviewed the case file and can cite the victim, timeline, and strongest documented lead.
          context_from_knowledge:
            victim_name: "The case file identifies the victim as {value}."
            victim_timeline: "{value}"
            lead_suspect: "{value}"
            strongest_lead: "{value}"
            ledger_entry_time: "{value}"
          retract_context:
            case_file_status: You have not reviewed the case file yet, so its contents are still unknown to you.
      ledger_page:
        kind: clue
        fragility: weather_sensitive
        clue_text: The ledger page records a missing payment tied to the mansion and tonight's visit.
        initial_custody: {kind: npc, id: daria_stone}
        readable:
          aliases: [ledger page, ledger]
          discovery: ledger_page
          leads: [The ledger page exposes a missing payment entry tied to tonight's visit.]
      route_key:
        kind: evidence
        clue_text: The route key marks a service passage someone expected to use after dark.
        initial_custody: {kind: room, id: market_lane}
      arrival_sedan:
        name: dark sedan
        description: A dark sedan is parked by the drive where you left it after arriving at the mansion.
        kind: vehicle
        portable: false
        initial_state: parked_beside_the_drive
        initial_custody: {kind: room, id: front_steps}
        owner: player
        driver: player
    opening_setup:
      protagonist_name: Detective Elias Wren
      protagonist_background: "A meticulous private detective hired to investigate Emma Vale's murder, you rely on patient observation while the memory of one unsolved case keeps you wary of easy answers."
      opening_contact: {role: assistant, relationship: assistant}
      arrival_order: [player, daria_stone]
      public_briefing: [opening_situation, case_status, victim_name, victim_timeline]
      pending_knowledge: [local_context]
      protected_knowledge: [future_revelations]
      player_context:
        arrival_mode: You drove your own sedan to the mansion and left it by the drive.
        knowledge_state: You have only just arrived and have not yet gathered evidence from the scene.
        case_file_status: You have not reviewed the case file yet, so its contents are still unknown to you.
        threshold_pause: Daria arrived before you, confirmed that Emma Vale's murder has put the household on edge, and saved the case-file details for your own review.
      case_facts:
        case_status: Emma Vale was murdered at the mansion, and you were hired to investigate the crime.
        victim_name: Emma Vale
        victim_timeline: Emma Vale was last seen shortly before midnight in the west gallery.
        lead_suspect: The groundskeeper was the last verified witness to see Emma alive.
        strongest_lead: The strongest documented lead is a missing ledger payment tied to the mansion and tonight's visit.
        ledger_entry_time: The final ledger entry is time-stamped 11:40 p.m., twenty minutes before Emma Vale was last seen.
    goals:
      setup: "Review the case file, question your first contact, and identify the strongest lead."
      primary: "Uncover who is behind the case and why the truth was buried."
  fantasy:
    <<: *default
    map:
      rooms: [village_gate, market_square, scribe_hall, enchanted_wood, citadel_steps, sanctum]
      environment:
        village_gate: {exposure: outdoor, ambient_source: the gate road}
        market_square: {exposure: outdoor, ambient_source: the square}
        scribe_hall: {exposure: enclosed}
        enchanted_wood: {exposure: outdoor, ambient_source: the woods}
        citadel_steps: {exposure: outdoor, ambient_source: the citadel steps}
        sanctum: {exposure: enclosed}
    characters:
      traits: [observant, independent]
      appearance: "A distinct, scene-appropriate figure."
      role: contact
      relationship: arrives_with_the_player
      scene_purpose: "Offer a relevant perspective on the opening situation."
      initial_knowledge: [public_briefing]
      protected_knowledge: []
      opening_contact:
        id: selene_ward
        name: Selene Ward
        location: village_gate
        pronouns: she/her
        appearance: "A travel-stained blue mantle pinned with a silver quill."
        description: "Selene Ward guards a warded scroll beneath her blue mantle."
        role: guide
        relationship: trusted_guide
        scene_purpose: "Brief the player on the warded-scroll route before the enchanted wood."
        initial_knowledge: [public_briefing, warded_route]
        protected_knowledge: []
    items: [rune_token, moon_blade, warded_scroll]
    item_details:
      warded_scroll:
        initial_custody: {kind: npc, id: selene_ward}
        readable:
          aliases: [warded scroll, scroll]
          discovery: warded_scroll
          knowledge: [warded_route]
          npc_disclosures: {selene_ward: [warded_route]}
          leads: [The warded scroll names a safe route through the enchanted wood.]
    opening_setup:
      arrival_order: [player, opening_contact]
      public_briefing: [opening_situation]
      pending_knowledge: [local_context]
      protected_knowledge: [future_revelations]
      case_facts:
        warded_route: The warded scroll marks the moonlit ford as the safe route through the enchanted wood.
  sci-fi:
    <<: *default
    map:
      rooms: [dock_hub, market_arcade, archive_node, lab_ring, tower_array, command_core]
      environment:
        dock_hub: {exposure: sheltered, ambient_source: the docking bay}
        market_arcade: {exposure: enclosed}
        archive_node: {exposure: enclosed}
        lab_ring: {exposure: enclosed}
        tower_array: {exposure: sheltered, ambient_source: the array}
        command_core: {exposure: enclosed}
    items: [data_key, signal_lens, power_cell]
    item_details:
      data_key:
        readable:
          aliases: [data key, log]
          discovery: data_key
          leads: [The data key records a diagnostic route into the command core.]
  romance:
    <<: *default
    map:
      rooms: [courtyard, cafe_row, garden_path, gallery_hall, river_walk, lantern_square]
      environment:
        courtyard: {exposure: outdoor, ambient_source: the courtyard}
        cafe_row: {exposure: sheltered, ambient_source: the cafe row}
        garden_path: {exposure: outdoor, ambient_source: the garden path}
        gallery_hall: {exposure: enclosed}
        river_walk: {exposure: outdoor, ambient_source: the river walk}
        lantern_square: {exposure: outdoor, ambient_source: the square}
    items: [letter, locket, keepsake]
    item_details:
      letter:
        placement_security: protected
        readable:
          aliases: [letter, note]
          discovery: letter
          leads: [The letter makes clear that the meeting at lantern square was meant to be private.]
  adventure:
    <<: *default
    map:
      rooms: [camp, trailhead, cliff_pass, ruin_gate, inner_chamber, return_camp]
      environment:
        camp: {exposure: outdoor, ambient_source: the camp}
        trailhead: {exposure: outdoor, ambient_source: the trail}
        cliff_pass: {exposure: outdoor, ambient_source: the pass}
        ruin_gate: {exposure: outdoor, ambient_source: the ruin gate}
        inner_chamber: {exposure: enclosed}
        return_camp: {exposure: outdoor, ambient_source: the camp}
    items: [map_fragment, rope_kit, artifact_shard]
  action:
    <<: *default
    map:
      rooms: [safe_flat, alley_junction, control_room, warehouse, checkpoint, extraction_point]
      environment:
        safe_flat: {exposure: enclosed}
        alley_junction: {exposure: outdoor, ambient_source: the alley}
        control_room: {exposure: enclosed}
        warehouse: {exposure: enclosed}
        checkpoint: {exposure: sheltered, ambient_source: the checkpoint}
        extraction_point: {exposure: outdoor, ambient_source: the extraction route}
    items: [badge, breach_charge, comm_scrambler]
  suspense:
    <<: *default
    map:
      rooms: [apartment, backstreet, records_room, subway_platform, abandoned_site, panic_room]
      environment:
        apartment: {exposure: enclosed}
        backstreet: {exposure: outdoor, ambient_source: the backstreet}
        records_room: {exposure: enclosed}
        subway_platform: {exposure: sheltered, ambient_source: the platform}
        abandoned_site: {exposure: outdoor, ambient_source: the site}
        panic_room: {exposure: enclosed}
    items: [burner_phone, security_card, flash_drive]
  drama:
    <<: *default
    map:
      rooms: [family_home, main_street, clinic, school_hall, community_center, lake_house]
      environment:
        family_home: {exposure: enclosed}
        main_street: {exposure: outdoor, ambient_source: the street}
        clinic: {exposure: enclosed}
        school_hall: {exposure: enclosed}
        community_center: {exposure: enclosed}
        lake_house: {exposure: sheltered, ambient_source: the lake}
    items: [old_photo, medical_note, voice_message]
  horror:
    <<: *default
    map:
      rooms: [old_house, fog_road, chapel_ruins, cellar, woods_edge, ritual_room]
      environment:
        old_house: {exposure: enclosed}
        fog_road: {exposure: outdoor, ambient_source: the road}
        chapel_ruins: {exposure: sheltered, ambient_source: the ruins}
        cellar: {exposure: enclosed}
        woods_edge: {exposure: outdoor, ambient_source: the woods}
        ritual_room: {exposure: enclosed}
    items: [salt_pouch, candle_bundle, sigil_stone]
    goals:
      setup: "Get oriented, survey the immediate threat, and establish a safe next move."
      primary: "Understand what is haunting the situation and break its hold before it spreads."
  thriller:
    <<: *default
    map:
      rooms: [transit_hub, newsroom, intel_vault, industrial_yard, embassy_corridor, final_site]
      environment:
        transit_hub: {exposure: sheltered, ambient_source: the transit hub}
        newsroom: {exposure: enclosed}
        intel_vault: {exposure: enclosed}
        industrial_yard: {exposure: outdoor, ambient_source: the yard}
        embassy_corridor: {exposure: enclosed}
        final_site: {exposure: outdoor, ambient_source: the site}
    items: [cipher_sheet, surveillance_tape, access_chip]
    goals:
      setup: "Get oriented, verify your intel, and secure the first trustworthy contact."
      primary: "Expose the operation driving the crisis and stop it before escalation."
