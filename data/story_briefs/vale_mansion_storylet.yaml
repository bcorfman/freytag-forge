schema_version: freytag-story-brief-v1
id: vale_mansion_storylet
genre: mystery
profile: mystery
premise: >-
  Detective Elias Wren must establish how Emma Vale died before the household
  converts suspicion of the groundskeeper into an irreversible false accusation.
opening_public_boundary: >-
  Emma Vale is dead in the west gallery. The household is frightened, the storm
  is worsening, and the groundskeeper is being blamed before the evidence is in.
world_notes:
  - A storm-bound estate makes custody, access, and fading physical traces matter.
  - Public rooms, private records, service routes, and the gallery create distinct social and investigative pressure.
cast_notes:
  - Elias needs evidence before accusation; Daria holds the public case file.
  - The groundskeeper is vulnerable to a false accusation, while Harrow can redirect suspicion.
hard_truths:
  - Beatrice Harrow diverted restoration payments and killed Emma Vale.
  - The groundskeeper's delivery records and witness account clear the apparent opportunity.
protections:
  - Harrow's identity remains unavailable until independently supported evidence establishes her case.
ending_constraints:
  - The resolution must clear the groundskeeper and hold Harrow accountable through committed evidence.
dramatic_beats:
  - The death becomes urgent when staged evidence makes accident implausible.
  - A payment trail turns suspicion into a conflict over motive and access.
  - The household's rush to blame the groundskeeper forces Elias to intervene before the storm erases traces.
  - Elias must assemble a supported case against Harrow without leaking the solution early.
possibility_library:
  - Question witnesses, inspect documents, trace access routes, and test the gallery staging.
  - Let failed searches expose another witness, location, or record rather than end progress.
  - Allow social pressure, weather, and competing accusations to complicate the same evidence path.
author_notes:
  - Author-approved Phase 0 vertical-slice dramatic direction for the offline storylet compiler.
  - Preserve player freedom to accuse, bargain, search, or refuse; storylets guide consequences rather than commands.
