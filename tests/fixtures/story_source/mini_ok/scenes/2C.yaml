        when: {purge_window_missed: false}
        says: Rebecca reveals the purge order, Brandon says yes, and the corridor opens onto two urgent moves.
        text: >-
          Rebecca answers Kristin without taking her eyes off Brandon. "Trust is a luxury. Decide quickly."
          Her tablet chimes. She reads it, and her face changes. "The purge order. It starts within hours, and my people
          are on the list." Brandon looks at Kristin, then says, "Yes." The guards stand down, and Rebecca goes to move
          against Charles. Brandon says, "There is no time to argue. The broadcast uplink is at one end of this corridor.
          We can send the evidence now. The transfer carts are at the other end. You can free a cart of captives before
          the guards react. Pick one, Kristin."
