scene: 2C
title: The Trap Closes
location: purge_chamber
objective: Get free of Rebecca and commit to a move before the purge
freytag_phase: crisis
situation: A command corridor on the facility’s command levels, above the detention sectors
pressure: Charles's purge order arrives in the middle of it.
turns: {min: 8, nudge: 9, handoff: 16}
companions: [brandon]
