beats:
  - id: kristin_steadies_1a
    at_turn: 3
    trailing: true
    when: {michelle_abduction_suspicion: false}
    sets: {michelle_abduction_suspicion: true}
    verbatim: true
    say: "Kristin makes herself stop and look properly. Michelle's phone is still here - damaged a bit but still working. Then she sees the back door. The splinters around the frame point outward, away from the house. A door forced from outside would splinter inward. Someone broke this one from inside to make it look like a break-in. It looks staged."
  - id: patrol_arrives_1a
    at_turn: 6
    trailing: true
    sets: {patrol_on_scene: true}
    verbatim: true
    say: A federal emergency patrol pulls up outside Michelle's house. Two officers get out. One walks to the front door. The other looks over the street.
  - id: patrol_enters_1a
    at_turn: 7
    trailing: true
    when: {patrol_on_scene: true}
    sets: {patrol_in_house: true}
    verbatim: true
    say: The front door opens. An officer walks in and heads straight for Michelle's workstation.
  - id: officer_presses_1a
    at_turn: 7
    when: {card_challenged: true, patrol_in_house: true}
    sets: {officer_demanded_card: true}
    verbatim: true
    say: "The officer plants himself between her and the front door and holds out a gloved hand. \"Whatever you just took from that desk. Let's see it, ma'am. Right now.\""
  - id: reyes_rams_drawer_1a
    at_turn: 8
    trailing: true
    when: {patrol_in_house: true, drawer_gap_pointed_out: false, memory_card_recovered: false}
    sets: {drawer_gap_pointed_out: true}
    verbatim: true
    say: "Reyes tugs at the workstation drawer. It sticks. Frustrated, he rams it back into place with the heel of his hand, and it sits high in its frame. A thin gap shows beneath its lower edge, wide enough for Kristin's fingers. Reyes never looks down. Only Kristin sees it."
  - id: patrol_leaves_1a
    at_turn: 10
    trailing: true
    when: {patrol_on_scene: true}
    sets: {patrol_departed: true, patrol_on_scene: false, patrol_in_house: false}
    verbatim: true
    say:
      - when: {card_challenged: true}
        text: "The officer's radio crackles with a description that is hers. He backs out through the front door, eyes on her the whole way, and the patrol pulls away from the curb."
      - text: The patrol pulls away from the curb.
  - id: patrol_returns_1a
    at_turn: 13
    when: {patrol_departed: true}
    sets: {patrol_return_pressure: true}
    verbatim: true
    say:
      - when: {patrol_departed: true}
        text: The patrol is coming back to the house.
      - text: A federal emergency patrol turns onto Michelle's street.
