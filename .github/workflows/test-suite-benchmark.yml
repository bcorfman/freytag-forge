name: test-suite benchmark

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: collection-only
            args: "--no-cov --collect-only"
          - name: no-coverage
            args: "--no-cov"
          - name: coverage
            args: "--cov"
          - name: coverage-context
            args: "--cov-context=test"
          - name: coverage-health
            args: "--cov --tier-report=artifacts/health.json"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: latest
      - name: Install dependencies
        run: uv sync
      - name: Run benchmark variant
        run: >-
          TMPDIR=/tmp uv run pytest -q ${{ matrix.args }}
          --expected-test-count=548
          --tier-report=artifacts/${{ matrix.name }}.json
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-suite-benchmark-${{ matrix.name }}
          path: artifacts/
