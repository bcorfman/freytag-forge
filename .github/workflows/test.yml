name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: TMPDIR=/tmp uv run pytest -q --cov-context=test --expected-test-count=548 --tier-report=artifacts/test-suite-health.json
      - name: Upload test-suite health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-suite-health
          path: artifacts/test-suite-health.json
