name: tests

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  statuses: write
  actions: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cutover-contracts:
    name: Cutover contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: latest
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check --select E9,F63,F7,F82 .
      - name: Verify compiled stories and V2 runtime contracts
        run: >-
          TMPDIR=/tmp uv run pytest -q --no-cov
          tests/test_authoring_compiler.py tests/test_runtime_v2.py tests/test_cloudflare_turn_model.py
          --tier-report=artifacts/v2-runtime.json
      - name: Smoke hosted V2 API adapter
        run: TMPDIR=/tmp uv run pytest -q --no-cov tests/test_web_demo_v2.py tests/test_deployment_channel_contract.py
      - name: Upload cutover reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cutover-contracts
          path: artifacts/
          if-no-files-found: warn

  fast-feedback:
    name: Fast feedback (unit and component)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: latest
      - name: Locate uv cache
        id: uv-cache-dir
        run: echo "dir=$(uv cache dir)" >> "$GITHUB_OUTPUT"
      - name: Cache uv dependencies
        id: uv-cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.uv-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
      - name: Record dependency cache result
        run: |
          if [ "${{ steps.uv-cache.outputs.cache-hit }}" = "true" ]; then
            echo "uv dependency cache: hit" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "uv dependency cache: miss" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install dependencies
        run: uv sync --locked
      - name: Run fast feedback tests
        run: TMPDIR=/tmp uv run pytest -q --no-cov -m "unit or component"

  test:
    name: Required coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: latest
      - name: Locate uv cache
        id: uv-cache-dir
        run: echo "dir=$(uv cache dir)" >> "$GITHUB_OUTPUT"
      - name: Cache uv dependencies
        id: uv-cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.uv-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
      - name: Record dependency cache result
        run: |
          mkdir -p artifacts
          cache_status=miss
          if [ "${{ steps.uv-cache.outputs.cache-hit }}" = "true" ]; then cache_status=hit; fi
          printf '{"cache":"uv","status":"%s","key":"%s"}\n' "$cache_status" "${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}" > artifacts/ci-cache.json
          echo "uv dependency cache: $cache_status" >> "$GITHUB_STEP_SUMMARY"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: TMPDIR=/tmp uv run pytest -q --cov -n 2 --tier-report=artifacts/test-suite-health.json
      - name: Upload test-suite health report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-suite-health
          path: artifacts/
          if-no-files-found: warn

  deploy-staging:
    name: Deploy staging
    if: github.ref == 'refs/heads/main' && success()
    needs: [cutover-contracts, fast-feedback, test]
    runs-on: ubuntu-latest
    environment:
      name: freytag-forge / staging
    outputs:
      api_base_url: ${{ steps.deployment.outputs.api_base_url }}
      sha: ${{ steps.deployment.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify immutable deployment revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Deploy the tested SHA to Railway staging
        id: deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_STAGING_ENVIRONMENT_ID }}
          RAILWAY_PUBLIC_API_URL: ${{ vars.RAILWAY_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          for required in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_SERVICE_ID RAILWAY_ENVIRONMENT_ID RAILWAY_PUBLIC_API_URL; do test -n "${!required}" || { echo "Missing staging configuration: $required" >&2; exit 1; }; done
          railway variable set "FREYTAG_DEPLOYMENT_SHA=$GITHUB_SHA" --skip-deploys --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID"
          timeout 300s railway up --ci --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --message "github-sha=$GITHUB_SHA"
          health=''
          health_channel=''
          health_sha=''
          for attempt in $(seq 1 60); do
            deployments="$(railway deployment list --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --limit 20 --json)"
            deployment_status="$(jq -r --arg sha "$GITHUB_SHA" 'map(select(.message? == ("github-sha=" + $sha) or .meta.message? == ("github-sha=" + $sha))) | sort_by(.createdAt) | last | .status // "not-found"' <<<"$deployments")"
            echo "Railway deployment status: $deployment_status (attempt $attempt/60)"
            health="$(curl --fail --silent --show-error "${RAILWAY_PUBLIC_API_URL%/}/api/v1/health" || true)"
            health_channel="$(jq -r '.channel // empty' <<<"$health" 2>/dev/null || true)"
            health_sha="$(jq -r '.sha // empty' <<<"$health" 2>/dev/null || true)"
            test "$(jq -r '.status // empty' <<<"$health" 2>/dev/null || true)" = ok && test "$health_channel" = staging && test "$health_sha" = "$GITHUB_SHA" && break
            sleep 10
          done
          test "$health_channel" = staging && test "$health_sha" = "$GITHUB_SHA"
          {
            echo "api_base_url=${RAILWAY_PUBLIC_API_URL%/}"
            echo "sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
      - name: Publish staging Pages bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before_pages_run_ids="$(gh run list --workflow deploy-frontend-pages.yml --event workflow_dispatch --limit 100 --json databaseId --jq '.[].databaseId')"
          gh workflow run deploy-frontend-pages.yml --ref main -f channel=staging -f sha="$GITHUB_SHA"
          run_id=''
          for attempt in $(seq 1 15); do
            candidate_run_ids="$(gh run list --workflow deploy-frontend-pages.yml --event workflow_dispatch --limit 100 --json databaseId --jq '.[].databaseId')"
            while read -r candidate_run_id; do
              test -n "$candidate_run_id" || continue
              if ! grep -Fxq "$candidate_run_id" <<<"$before_pages_run_ids"; then
                run_id="$candidate_run_id"
                break
              fi
            done <<<"$candidate_run_ids"
            test -n "$run_id" && break
            sleep 2
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status
          repository_name="${GITHUB_REPOSITORY#*/}"
          pages_metadata_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repository_name}/dev/deployment.json"
          pages_metadata=''
          pages_channel=''
          pages_sha=''
          for attempt in $(seq 1 30); do
            pages_metadata="$(curl --fail --silent --show-error "$pages_metadata_url" || true)"
            pages_channel="$(jq -r '.channel // empty' <<<"$pages_metadata" 2>/dev/null || true)"
            pages_sha="$(jq -r '.sha // empty' <<<"$pages_metadata" 2>/dev/null || true)"
            test "$pages_channel" = staging && test "$pages_sha" = "$GITHUB_SHA" && break
            sleep 2
          done
          test "$pages_channel" = staging
          test "$pages_sha" = "$GITHUB_SHA"
  hosted-demo-staging-e2e:
    name: Hosted demo staging E2E
    needs: deploy-staging
    runs-on: ubuntu-latest
    env:
      HOSTED_DEMO_API_BASE_URL: ${{ needs.deploy-staging.outputs.api_base_url }}
      HOSTED_DEMO_ORIGIN: https://bcorfman.github.io
      HOSTED_DEMO_CHANNEL: staging
      DEPLOYED_SHA: ${{ needs.deploy-staging.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.deploy-staging.outputs.sha }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: latest
      - name: Install dependencies
        run: uv sync --locked
      - name: Exercise the deployed staging browser flow
        run: TMPDIR=/tmp uv run pytest -q --no-cov tests/test_web_demo_v2.py

  v2-staging-evaluation:
    name: V2 staging evaluation and promotion gate
    needs: [deploy-staging, hosted-demo-staging-e2e]
    runs-on: ubuntu-latest
    env:
      HOSTED_DEMO_API_BASE_URL: ${{ needs.deploy-staging.outputs.api_base_url }}
      DEPLOYED_SHA: ${{ needs.deploy-staging.outputs.sha }}
      FREYTAG_EVALUATION_REPORT: artifacts/staging-evaluation.json
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.deploy-staging.outputs.sha }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: latest
      - name: Install dependencies
        run: uv sync --locked
      - name: Compare the deployed candidate with Phase 0 operational bounds
        run: TMPDIR=/tmp uv run pytest -q --no-cov tests/test_runtime_v2.py tests/test_web_demo_v2.py
      - name: Upload SHA-bound staging evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-evaluation-${{ needs.deploy-staging.outputs.sha }}
          path: artifacts/staging-evaluation.json
          if-no-files-found: error

  record-staging-deployment:
    name: Record staging deployment
    if: always() && github.ref == 'refs/heads/main'
    needs: [deploy-staging, hosted-demo-staging-e2e, v2-staging-evaluation]
    runs-on: ubuntu-latest
    steps:
      - name: Publish staged-SHA proof
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_RESULT: ${{ needs.deploy-staging.result }}
          E2E_RESULT: ${{ needs.hosted-demo-staging-e2e.result }}
          EVALUATION_RESULT: ${{ needs.v2-staging-evaluation.result }}
        run: |
          set -euo pipefail
          state=failure
          description="Staging deployment, hosted E2E, or Phase 5 evaluation failed"
          if test "$DEPLOYMENT_RESULT" = success && test "$E2E_RESULT" = success && test "$EVALUATION_RESULT" = success; then
            state=success
            description="Staged API, Pages bundle, hosted E2E, and Phase 5 gate passed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context=staging-deployment -f description="$description" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
