name: tests

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  statuses: write

concurrency:
  # This lock spans validation, deploy, and post-deploy E2E for each branch.
  # In particular, no later main SHA can replace the API while an earlier SHA
  # is still being verified.
  group: production-promotion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cutover-contracts:
    name: Cutover contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: latest
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check --select E9,F63,F7,F82 .
      - name: Verify deterministic fixtures and behavioral evaluation
        run: >-
          TMPDIR=/tmp uv run pytest -q --no-cov
          tests/test_evaluation.py tests/test_reproducibility.py tests/test_phase8_story_packages.py
          --tier-report=artifacts/phase9-evaluation.json
      - name: Smoke local and hosted API adapters
        run: TMPDIR=/tmp uv run pytest -q --no-cov tests/test_web_api.py tests/test_web_demo_api.py tests/test_web_surface_parity.py
      - name: Verify artifact integrity
        run: TMPDIR=/tmp uv run pytest -q --no-cov tests/test_story_state_artifacts.py
      - name: Upload cutover reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cutover-contracts
          path: artifacts/
          if-no-files-found: warn

  fast-feedback:
    name: Fast feedback (unit and component)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: latest
      - name: Locate uv cache
        id: uv-cache-dir
        run: echo "dir=$(uv cache dir)" >> "$GITHUB_OUTPUT"
      - name: Cache uv dependencies
        id: uv-cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.uv-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
      - name: Record dependency cache result
        run: |
          if [ "${{ steps.uv-cache.outputs.cache-hit }}" = "true" ]; then
            echo "uv dependency cache: hit" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "uv dependency cache: miss" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install dependencies
        run: uv sync --locked
      - name: Run fast feedback tests
        run: TMPDIR=/tmp uv run pytest -q --no-cov -m "unit or component"

  test:
    name: Required coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: latest
      - name: Locate uv cache
        id: uv-cache-dir
        run: echo "dir=$(uv cache dir)" >> "$GITHUB_OUTPUT"
      - name: Cache uv dependencies
        id: uv-cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.uv-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
      - name: Record dependency cache result
        run: |
          mkdir -p artifacts
          cache_status=miss
          if [ "${{ steps.uv-cache.outputs.cache-hit }}" = "true" ]; then cache_status=hit; fi
          printf '{"cache":"uv","status":"%s","key":"%s"}\n' "$cache_status" "${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}" > artifacts/ci-cache.json
          echo "uv dependency cache: $cache_status" >> "$GITHUB_STEP_SUMMARY"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: TMPDIR=/tmp uv run pytest -q --cov -n 2 --tier-report=artifacts/test-suite-health.json
      - name: Upload test-suite health report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-suite-health
          path: artifacts/
          if-no-files-found: warn

  deploy-production:
    name: Deploy production to Railway
    # Phase 1 supersedes this legacy main-to-production path. Production is
    # promoted only by promote-production.yml after staging has succeeded.
    if: ${{ false }}
    needs: [cutover-contracts, fast-feedback, test]
    runs-on: ubuntu-latest
    environment:
      name: freytag-forge / production
    outputs:
      api_base_url: ${{ steps.deployment.outputs.api_base_url }}
      deployment_id: ${{ steps.deployment.outputs.deployment_id }}
      deployment_url: ${{ steps.deployment.outputs.deployment_url }}
      rollback_deployment_id: ${{ steps.deployment.outputs.rollback_deployment_id }}
      sha: ${{ steps.deployment.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify immutable deployment revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Deploy, verify Railway state, and check health
        id: deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}
          RAILWAY_PUBLIC_API_URL: ${{ vars.RAILWAY_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          for required in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_SERVICE_ID RAILWAY_ENVIRONMENT_ID RAILWAY_PUBLIC_API_URL; do
            test -n "${!required}" || { echo "Missing production configuration: $required" >&2; exit 1; }
          done
          api_base_url="${RAILWAY_PUBLIC_API_URL%/}"
          deployment_id=""
          deployment_status=""
          deployment_url=""
          rollback_deployment_id="$(railway deployment list --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --limit 100 --json | jq -er 'map(select(.status == "SUCCESS" or .status == "ACTIVE")) | sort_by(.createdAt) | last | .id')"
          railway_up_exit=0
          submitted_deployment_id=""
          write_evidence() {
            mkdir -p artifacts
            jq -n --arg api_base_url "$api_base_url" --arg deployment_id "$deployment_id" --arg deployment_url "$deployment_url" --arg rollback_deployment_id "$rollback_deployment_id" --arg sha "$GITHUB_SHA" --arg status "$deployment_status" --arg submitted_deployment_id "$submitted_deployment_id" --argjson railway_up_exit "$railway_up_exit" '{api_base_url: $api_base_url, deployment_id: $deployment_id, deployment_url: $deployment_url, rollback_deployment_id: $rollback_deployment_id, sha: $sha, status: $status, submitted_deployment_id: $submitted_deployment_id, railway_up_exit: $railway_up_exit}' > artifacts/railway-deployment.json
          }
          trap write_evidence EXIT
          set +e
          railway_up_output="$(railway up --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --message "github-sha=$GITHUB_SHA" --detach 2>&1)"
          railway_up_exit=$?
          set -e
          printf '%s\n' "$railway_up_output"
          submitted_deployment_id="$(sed -nE 's#.*[?&]id=([^&[:space:]]+).*#\1#p' <<<"$railway_up_output" | tail -n 1)"
          if test "$railway_up_exit" -ne 0; then
            echo "railway up returned $railway_up_exit after upload; verifying Railway's deployment record." >&2
          fi
          for attempt in $(seq 1 60); do
            deployments="$(railway deployment list --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --limit 20 --json)"
            candidate="$(jq -cer --arg deployment_id "$submitted_deployment_id" --arg sha "$GITHUB_SHA" '
              map(select(
                (($deployment_id != "") and (.id? == $deployment_id)) or
                (.meta.commitHash? == $sha) or
                (.meta.commitSha? == $sha) or
                (.meta.githubCommitSha? == $sha) or
                (.message? == ("github-sha=" + $sha)) or
                (.meta.message? == ("github-sha=" + $sha))
              )) | sort_by(.createdAt) | last // empty
            ' <<<"$deployments")"
            if test -n "$candidate"; then
              deployment_id="$(jq -er '.id' <<<"$candidate")"
              deployment_status="$(jq -er '.status' <<<"$candidate")"
              deployment_url="$(jq -r '.url // .dashboardUrl // empty' <<<"$candidate")"
              case "$deployment_status" in
                ACTIVE|SUCCESS) break ;;
                FAILED|CRASHED|REMOVED) echo "Railway deployment $deployment_id ended with $deployment_status" >&2; exit 1 ;;
              esac
            fi
            sleep 10
          done
          case "$deployment_status" in
            ACTIVE|SUCCESS) ;;
            *) echo "Railway deployment did not reach ACTIVE before timeout (last status: ${deployment_status:-not-found})" >&2; exit 1 ;;
          esac
          test -n "$deployment_id" || { echo "Railway did not expose an unambiguous deployment for $GITHUB_SHA" >&2; exit 1; }
          curl --fail --retry 6 --retry-all-errors --retry-delay 5 "$api_base_url/api/v1/health" | jq -e '.status == "ok"' >/dev/null
          {
            echo "api_base_url=$api_base_url"
            echo "deployment_id=$deployment_id"
            echo "deployment_url=$deployment_url"
            echo "rollback_deployment_id=$rollback_deployment_id"
            echo "sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Railway deployment"
            echo "- SHA: \`$GITHUB_SHA\`"
            echo "- Deployment: ${deployment_url:-$deployment_id}"
            echo "- API: $api_base_url"
            echo "- Health: ok"
            echo "- Railway CLI handoff exit: $railway_up_exit"
            echo "- Submitted deployment: ${submitted_deployment_id:-not-reported}"
            echo "- Recorded rollback deployment: ${rollback_deployment_id:-not-configured}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Railway deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: railway-deployment-${{ github.sha }}
          path: artifacts/railway-deployment.json
          if-no-files-found: warn

  hosted-demo-e2e:
    name: Hosted demo production E2E
    needs: deploy-production
    runs-on: ubuntu-latest
    env:
      HOSTED_DEMO_API_BASE_URL: ${{ needs.deploy-production.outputs.api_base_url }}
      HOSTED_DEMO_ORIGIN: https://bcorfman.github.io
      DEPLOYMENT_ID: ${{ needs.deploy-production.outputs.deployment_id }}
      DEPLOYMENT_URL: ${{ needs.deploy-production.outputs.deployment_url }}
      DEPLOYED_SHA: ${{ needs.deploy-production.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.deploy-production.outputs.sha }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: latest
      - name: Install dependencies
        run: uv sync --locked
      - name: Exercise the deployed browser session flow
        run: TMPDIR=/tmp uv run pytest -q --no-cov tests/test_hosted_demo_e2e.py
      - name: Record E2E evidence
        if: always()
        run: |
          mkdir -p artifacts
          jq -n --arg api_base_url "$HOSTED_DEMO_API_BASE_URL" --arg deployment_id "$DEPLOYMENT_ID" --arg deployment_url "$DEPLOYMENT_URL" --arg sha "$DEPLOYED_SHA" --arg result "${{ job.status }}" '{api_base_url: $api_base_url, deployment_id: $deployment_id, deployment_url: $deployment_url, sha: $sha, result: $result}' > artifacts/hosted-demo-e2e.json
          {
            echo "## Hosted-demo E2E"
            echo "- SHA: \`$DEPLOYED_SHA\`"
            echo "- Deployment: ${DEPLOYMENT_URL:-$DEPLOYMENT_ID}"
            echo "- Tested API: $HOSTED_DEMO_API_BASE_URL"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-demo-e2e-${{ needs.deploy-production.outputs.sha }}
          path: artifacts/hosted-demo-e2e.json
          if-no-files-found: error

  record-production-promotion:
    name: Record production promotion
    if: ${{ false }}
    needs: [deploy-production, hosted-demo-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the promotion status
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ needs.deploy-production.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ needs.deploy-production.outputs.deployment_url }}
          API_BASE_URL: ${{ needs.deploy-production.outputs.api_base_url }}
          DEPLOYED_SHA: ${{ needs.deploy-production.outputs.sha || github.sha }}
          DEPLOYMENT_RESULT: ${{ needs.deploy-production.result }}
          E2E_RESULT: ${{ needs.hosted-demo-e2e.result }}
        run: |
          set -euo pipefail
          state=failure
          description="Railway deployment or hosted-demo E2E failed"
          if test "$DEPLOYMENT_RESULT" = success && test "$E2E_RESULT" = success; then
            state=success
            description="Railway deployment and hosted-demo E2E passed"
          fi
          jq -n --arg state "$state" --arg description "$description" --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state: $state, context: "production-promotion", description: $description, target_url: $target_url}' > status.json
          curl --fail --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" --header "Content-Type: application/json" --data @status.json "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$DEPLOYED_SHA"
          {
            echo "## Production promotion: $state"
            echo "- SHA: \`$DEPLOYED_SHA\`"
            echo "- Railway deployment: ${DEPLOYMENT_URL:-${DEPLOYMENT_ID:-not-created}}"
            echo "- Tested API: ${API_BASE_URL:-not-available}"
            echo "- Deploy job: $DEPLOYMENT_RESULT"
            echo "- E2E job: $E2E_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
