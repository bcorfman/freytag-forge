name: Deploy Frontend to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to replace; the opposite channel is preserved from the published artifact.
        required: true
        type: choice
        options: [staging, production]
      sha:
        description: Full immutable SHA to build.
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-channel-promotion
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1
      - name: Verify immutable revision
        run: |
          [[ "${{ inputs.sha }}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Retrieve the published opposite Pages channel
        run: |
          set -euo pipefail
          repository_name="${GITHUB_REPOSITORY#*/}"
          channel_path=""
          if test "${{ inputs.channel }}" = production; then channel_path="dev/"; fi
          page_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repository_name}/${channel_path}"
          mirror_dir="$(mktemp -d)"
          wget --quiet --mirror --page-requisites --no-parent --directory-prefix="$mirror_dir" "$page_url"
          source_dir="$mirror_dir/${GITHUB_REPOSITORY_OWNER}.github.io/${repository_name}/${channel_path%/}"
          test -d "$source_dir" || { echo "Cannot retrieve published opposite channel from $page_url" >&2; exit 1; }
          mkdir -p published-pages
          if test "${{ inputs.channel }}" = staging; then
            cp -R "$source_dir/." published-pages/
            test -f published-pages/index.html || { echo "Cannot preserve opposite-channel index: published root index is missing." >&2; exit 1; }
          else
            mkdir -p published-pages/dev
            cp -R "$source_dir/." published-pages/dev/
            test -f published-pages/dev/index.html || { echo "Cannot preserve opposite-channel index: published dev index is missing." >&2; exit 1; }
          fi
      - name: Build the selected channel bundle
        working-directory: frontend
        env:
          VITE_DEPLOYMENT_CHANNEL: ${{ inputs.channel }}
          VITE_API_BASE_URL: ${{ inputs.channel == 'staging' && vars.VITE_STAGING_API_BASE_URL || vars.VITE_PRODUCTION_API_BASE_URL }}
          VITE_DEPLOYMENT_SHA: ${{ inputs.sha }}
        run: npm run build
      - name: Stamp immutable build metadata
        run: >-
          printf '{"channel":"%s","sha":"%s"}\n'
          '${{ inputs.channel }}' '${{ inputs.sha }}'
          > frontend/dist/deployment.json
      - name: Assemble root and dev artifact without replacing the opposite channel
        run: |
          set -euo pipefail
          rm -rf pages-artifact
          cp -R published-pages pages-artifact
          if test "${{ inputs.channel }}" = staging; then
            rm -rf pages-artifact/dev
            mkdir -p pages-artifact/dev
            cp -R frontend/dist/. pages-artifact/dev/
          else
            rm -f pages-artifact/index.html
            rm -rf pages-artifact/assets
            cp -R frontend/dist/. pages-artifact/
          fi
          test -f pages-artifact/index.html
          test -f pages-artifact/dev/index.html
      - name: Prove root and dev bundles contain only their channel API origins
        env:
          STAGING_API: ${{ vars.VITE_STAGING_API_BASE_URL }}
          PRODUCTION_API: ${{ vars.VITE_PRODUCTION_API_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$STAGING_API" && test -n "$PRODUCTION_API"
          grep -R --fixed-strings "$PRODUCTION_API" pages-artifact >/dev/null
          grep -R --fixed-strings "$STAGING_API" pages-artifact/dev >/dev/null
          ! grep -R --fixed-strings "$STAGING_API" pages-artifact --exclude-dir=dev
          ! grep -R --fixed-strings "$PRODUCTION_API" pages-artifact/dev
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-artifact

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
