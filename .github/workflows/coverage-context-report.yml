name: coverage context report

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: coverage-context-report
  cancel-in-progress: true

jobs:
  coverage-context-report:
    name: Coverage context report (informational)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: latest
      - name: Locate uv cache
        id: uv-cache-dir
        run: echo "dir=$(uv cache dir)" >> "$GITHUB_OUTPUT"
      - name: Cache uv dependencies
        id: uv-cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.uv-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
      - name: Record dependency cache result
        run: |
          mkdir -p artifacts
          cache_status=miss
          if [ "${{ steps.uv-cache.outputs.cache-hit }}" = "true"; then cache_status=hit; fi
          printf '{"cache":"uv","status":"%s","key":"%s"}\n' "$cache_status" "${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}" > artifacts/ci-cache.json
          echo "uv dependency cache: $cache_status" >> "$GITHUB_STEP_SUMMARY"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run context coverage report
        run: TMPDIR=/tmp uv run pytest -q --cov-context=test --tier-report=artifacts/test-suite-context-health.json
      - name: Upload context coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-suite-context-health
          path: artifacts/
          if-no-files-found: warn
