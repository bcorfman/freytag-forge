name: test-suite five-run benchmark

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  benchmark:
    name: Required gate median (five runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: latest
      - name: Locate uv cache
        id: uv-cache-dir
        run: echo "dir=$(uv cache dir)" >> "$GITHUB_OUTPUT"
      - name: Cache uv dependencies
        id: uv-cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.uv-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Run required command five times
        run: |
          mkdir -p artifacts
          for run_number in 1 2 3 4 5; do
            /usr/bin/time -f '%e' -o "artifacts/run-${run_number}.seconds" \
              env TMPDIR=/tmp uv run pytest -q --cov -n 2 \
                --tier-report="artifacts/run-${run_number}-health.json"
          done
          median=$(sort -n artifacts/run-*.seconds | sed -n '3p')
          {
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_OS}/${ImageOS}"
            echo "command=TMPDIR=/tmp uv run pytest -q --cov -n 2 --tier-report=artifacts/<run>-health.json"
            echo "coverage=ordinary (--cov)"
            echo "median_pytest_seconds=${median}"
            echo "samples=$(paste -sd, artifacts/run-*.seconds)"
          } | tee artifacts/five-run-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload five-run benchmark
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-suite-five-run-benchmark
          path: artifacts/
          if-no-files-found: warn
