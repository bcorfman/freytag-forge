name: Promote staged SHA to production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character SHA previously deployed successfully to staging.
        required: true
        type: string

permissions:
  contents: read
  statuses: write
  pages: write
  id-token: write

concurrency:
  group: production-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment:
      name: freytag-forge / production
    steps:
      - name: Require an immutable staged SHA
        env:
          INPUT_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "A full lowercase immutable SHA is required." >&2; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/commits/${INPUT_SHA}" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/commits/${INPUT_SHA}/status" --jq '.statuses[] | select(.context == "staging-deployment" and .state == "success")' | grep -q . || { echo "SHA was not staged successfully." >&2; exit 1; }
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1
      - name: Verify checked-out revision
        run: test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: latest
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Deploy and health-check production API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}
          RAILWAY_PUBLIC_API_URL: ${{ vars.RAILWAY_PUBLIC_API_URL }}
          DEPLOYED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          for required in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_SERVICE_ID RAILWAY_ENVIRONMENT_ID RAILWAY_PUBLIC_API_URL; do test -n "${!required}" || { echo "Missing production configuration: $required" >&2; exit 1; }; done
          rollback_deployment_id="$(railway deployment list --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --limit 100 --json | jq -er 'map(select(.status == "SUCCESS" or .status == "ACTIVE")) | sort_by(.createdAt) | last | .id')"
          echo "- Railway rollback candidate before promotion: \`$rollback_deployment_id\`" >> "$GITHUB_STEP_SUMMARY"
          railway up --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --message "github-sha=$DEPLOYED_SHA" --detach
          health=''
          health_channel=''
          health_sha=''
          for attempt in $(seq 1 60); do
            health="$(curl --fail --silent --show-error "${RAILWAY_PUBLIC_API_URL%/}/api/v1/health" || true)"
            health_channel="$(jq -r '.channel // empty' <<<"$health" 2>/dev/null || true)"
            health_sha="$(jq -r '.sha // empty' <<<"$health" 2>/dev/null || true)"
            test "$(jq -r '.status // empty' <<<"$health" 2>/dev/null || true)" = ok && test "$health_channel" = production && test "$health_sha" = "$DEPLOYED_SHA" && break
            sleep 10
          done
          test "$health_channel" = production && test "$health_sha" = "$DEPLOYED_SHA"
      - name: Publish production Pages bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-frontend-pages.yml --ref main -f channel=production -f sha="${{ inputs.sha }}"
          sleep 5
          run_id="$(gh run list --workflow deploy-frontend-pages.yml --commit "${{ inputs.sha }}" --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          gh run watch "$run_id" --exit-status
      - name: Verify browser flow at the production root
        env:
          HOSTED_DEMO_API_BASE_URL: ${{ vars.RAILWAY_PUBLIC_API_URL }}
          HOSTED_DEMO_ORIGIN: https://bcorfman.github.io/freytag-forge
        run: |
          uv sync --locked
          TMPDIR=/tmp uv run pytest -q --no-cov tests/test_hosted_demo_e2e.py
