name: Promote staged SHA to production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Optional full 40-character staging SHA; leave blank to promote the latest successful staging SHA.
        required: false
        type: string

permissions:
  contents: read
  statuses: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: production-promotion
  cancel-in-progress: false

jobs:
  validate-staged-sha:
    name: Validate staged SHA
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - name: Require an immutable successful staging SHA
        id: validate
        env:
          INPUT_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate_sha="$INPUT_SHA"
          if test -z "$candidate_sha"; then
            while read -r sha; do
              status="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/status" --jq '[.statuses[] | select(.context == "staging-deployment") | .state] | any(. == "success")')"
              if test "$status" = true; then
                candidate_sha="$sha"
                break
              fi
            done < <(gh api "repos/${GITHUB_REPOSITORY}/commits?sha=main&per_page=100" --paginate --jq '.[].sha')
          fi
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "No successful staging SHA is available on main." >&2; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/commits/${candidate_sha}" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/commits/${candidate_sha}/status" --jq '.statuses[] | select(.context == "staging-deployment" and .state == "success")' | grep -q . || { echo "SHA was not staged successfully." >&2; exit 1; }
          echo "Promoting staging candidate: $candidate_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy production
    needs: validate-staged-sha
    runs-on: ubuntu-latest
    environment:
      name: freytag-forge / production
    outputs:
      api_base_url: ${{ steps.deployment.outputs.api_base_url }}
      sha: ${{ steps.deployment.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-staged-sha.outputs.sha }}
          fetch-depth: 1
      - name: Verify checked-out revision
        run: test "$(git rev-parse HEAD)" = "${{ needs.validate-staged-sha.outputs.sha }}"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Deploy and health-check production API
        id: deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}
          RAILWAY_PUBLIC_API_URL: ${{ vars.RAILWAY_PUBLIC_API_URL }}
          DEPLOYED_SHA: ${{ needs.validate-staged-sha.outputs.sha }}
        run: |
          set -euo pipefail
          for required in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_SERVICE_ID RAILWAY_ENVIRONMENT_ID RAILWAY_PUBLIC_API_URL; do test -n "${!required}" || { echo "Missing production configuration: $required" >&2; exit 1; }; done
          if ! rollback_deployments="$(railway deployment list --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --limit 100 --json)"; then
            echo "Unable to list Railway deployments for the configured production target." >&2
            exit 1
          fi
          if ! jq -e 'type == "array"' >/dev/null <<<"$rollback_deployments"; then
            echo "Railway deployment list did not return a JSON array:" >&2
            jq -c . <<<"$rollback_deployments" >&2 || printf '%s\\n' "$rollback_deployments" >&2
            exit 1
          fi
          echo "Railway deployments visible before promotion (id, status, createdAt):"
          jq -r 'sort_by(.createdAt) | reverse | .[] | [.id, .status, .createdAt] | @tsv' <<<"$rollback_deployments"
          known_good_deployment_id="$(jq -r 'map(select(.status == "SUCCESS" or .status == "ACTIVE" or .status == "SLEEPING")) | sort_by(.createdAt) | last | .id // empty' <<<"$rollback_deployments")"
          if test -z "$known_good_deployment_id"; then
            echo "No eligible Railway known-good deployment (expected status SUCCESS, ACTIVE, or SLEEPING) for the configured production target." >&2
            exit 1
          fi
          echo "- Railway known-good deployment before promotion: \`$known_good_deployment_id\`" >> "$GITHUB_STEP_SUMMARY"
          railway variable set "FREYTAG_DEPLOYMENT_SHA=$DEPLOYED_SHA" --skip-deploys --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID"
          timeout 300s railway up --ci --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --message "github-sha=$DEPLOYED_SHA"
          version=''
          health_channel=''
          health_sha=''
          for attempt in $(seq 1 60); do
            deployments="$(railway deployment list --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --limit 20 --json)"
            deployment_status="$(jq -r --arg sha "$DEPLOYED_SHA" 'map(select(.message? == ("github-sha=" + $sha) or .meta.message? == ("github-sha=" + $sha))) | sort_by(.createdAt) | last | .status // "not-found"' <<<"$deployments")"
            echo "Railway deployment status: $deployment_status (attempt $attempt/60)"
            health="$(curl --fail --silent --show-error "${RAILWAY_PUBLIC_API_URL%/}/api/v1/health" || true)"
            version="$(curl --fail --silent --show-error "${RAILWAY_PUBLIC_API_URL%/}/api/v1/version" || true)"
            health_channel="$(jq -r '.channel // empty' <<<"$health" 2>/dev/null || true)"
            health_sha="$(jq -r '.sha // empty' <<<"$health" 2>/dev/null || true)"
            test "$(jq -r '.status // empty' <<<"$health" 2>/dev/null || true)" = ok && test "$(jq -r '.runtime // empty' <<<"$health" 2>/dev/null || true)" = scene-v1 && test "$health_channel" = production && test "$health_sha" = "$DEPLOYED_SHA" && test "$(jq -r '.api // empty' <<<"$version" 2>/dev/null || true)" = v1 && test "$(jq -r '.runtime // empty' <<<"$version" 2>/dev/null || true)" = scene-v1 && test "$(jq -r '.channel // empty' <<<"$version" 2>/dev/null || true)" = production && test "$(jq -r '.sha // empty' <<<"$version" 2>/dev/null || true)" = "$DEPLOYED_SHA" && break
            sleep 10
          done
          test "$health_channel" = production && test "$health_sha" = "$DEPLOYED_SHA"
          test "$(jq -r '.runtime // empty' <<<"$health")" = scene-v1
          test "$(jq -r '.api // empty' <<<"$version")" = v1
          test "$(jq -r '.runtime // empty' <<<"$version")" = scene-v1
          test "$(jq -r '.channel // empty' <<<"$version")" = production
          test "$(jq -r '.sha // empty' <<<"$version")" = "$DEPLOYED_SHA"
          {
            echo "api_base_url=${RAILWAY_PUBLIC_API_URL%/}"
            echo "sha=$DEPLOYED_SHA"
          } >> "$GITHUB_OUTPUT"
      - name: Publish production Pages bundle
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ needs.validate-staged-sha.outputs.sha }}
        run: |
          set -euo pipefail
          before_pages_run_ids="$(gh run list --workflow deploy-frontend-pages.yml --event workflow_dispatch --limit 100 --json databaseId --jq '.[].databaseId')"
          gh workflow run deploy-frontend-pages.yml --ref main -f channel=production -f sha="$DEPLOYED_SHA"
          run_id=''
          for attempt in $(seq 1 15); do
            candidate_run_ids="$(gh run list --workflow deploy-frontend-pages.yml --event workflow_dispatch --limit 100 --json databaseId --jq '.[].databaseId')"
            while read -r candidate_run_id; do
              test -n "$candidate_run_id" || continue
              if ! grep -Fxq "$candidate_run_id" <<<"$before_pages_run_ids"; then
                run_id="$candidate_run_id"
                break
              fi
            done <<<"$candidate_run_ids"
            test -n "$run_id" && break
            sleep 2
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status

  record-production-promotion:
    name: Record production promotion
    if: always()
    needs: [validate-staged-sha, deploy-production]
    runs-on: ubuntu-latest
    steps:
      - name: Publish promotion status
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_RESULT: ${{ needs.deploy-production.result }}
          DEPLOYED_SHA: ${{ needs.validate-staged-sha.outputs.sha }}
        run: |
          set -euo pipefail
          state=failure
          description="Production deployment failed"
          if test "$DEPLOYMENT_RESULT" = success; then
            state=success
            description="Production API and Pages bundle passed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${DEPLOYED_SHA}" -f state="$state" -f context=production-promotion -f description="$description" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
