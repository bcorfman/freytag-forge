name: review outcomes

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: read
  issues: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: latest
      - run: uv sync --locked
      - name: Write review outcomes report
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/review_outcomes.py --since-days 7
      - name: Add report to summary
        run: cat artifacts/review-outcomes/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: review-outcomes
          path: artifacts/review-outcomes
          retention-days: 90
