<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freytag Forge Demo</title>
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <p id="non-production-badge" class="non-production-badge" hidden>Staging — non-production</p>
        <p class="eyebrow">Hosted Demo</p>
        <h1>Freytag Forge</h1>
        <p class="lede">
          Freeform roleplay with consequences that hold.
        </p>
      </section>

      <section class="panel">
        <header class="panel-header">
          <div>
            <h2>Story Feed</h2>
            <p id="status-line" class="status-line">Connecting...</p>
          </div>
          <div class="panel-actions">
            <button id="new-game-button" type="button">New Session</button>
          </div>
        </header>

        <section id="transcript" class="transcript" aria-live="polite"></section>

        <section id="game-break-panel" class="game-break-panel" hidden aria-live="assertive">
          <p id="game-break-reason"></p>
          <div class="panel-actions">
            <button id="return-to-scene-button" type="button">Return to scene</button>
            <button id="proceed-button" type="button">Proceed</button>
          </div>
        </section>

        <form id="command-form" class="command-form">
          <label class="sr-only" for="command-input">Your action</label>
          <input
            id="command-input"
            name="command"
            type="text"
            autocomplete="off"
            placeholder="What do you do?"
          />
          <button id="send-button" type="submit">Send</button>
        </form>
      </section>
    </main>
  </body>
</html>
